description: >
  IT Del CTF (ITDEL CTF) is an annual national cyber security competition organized
  by IT Del (Institut Teknologi Del), an Indonesian institution in North Sumatra.
  The 2024 preliminary stage followed the Jeopardy style, with teams competing
  across a variety of challenge categories (web, rev, pwn, osint, crypto, forensics).
