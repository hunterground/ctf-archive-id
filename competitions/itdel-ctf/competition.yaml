notes: >
  Primary evidence is the IT Del CTF challenge repository (by challenge author
  jonscafe/k.eii alongside the other named authors), whose README states: "ITDEL CTF
  is an annual national cyber security competition organized by ITDEL in Indonesia.
  On 2024, ITDEL For the preliminary stage, the competition format follows the Jeopardy
  style, where teams compete in various categories of challenges."

  Scope note: IT Del's September 2024 news describes an internal Capture the Flag
  workshop for the IT Del community with Poltek SSN and Huawei. It is not yet confirmed
  whether that internal workshop and the national CTF are the same event or two distinct
  ones. This competition record reflects the national CTF evidenced by the challenge
  repository. Established year and recurring status come from the repository README's
  "annual" wording; no pre-2024 edition evidence was located.