notes: >-
  The event is a single-stage online jeopardy mirror of selected challenges from the local ARA 7.0 CTF;
  finalists of the local event were not allowed to enter. It has no qualifier or final of its own, so
  the round uses id `main` with `type: other` per the naming convention. The CTFtime scoreboard lists
  74 teams. Challenge materials come from the ctf-archives collection at commit 39d1e8aae2d41a7424265874ec97f6c64f8f20f1,
  which holds 16 challenges across six categories. The source tree also has a year-level README.md that
  only links the CTFtime page; it is not part of any challenge directory and is represented by the references
  instead of being copied into `original/`.
