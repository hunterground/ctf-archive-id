description: |-
  Kribo merupakan salah satu pegawai dari Perusahaan SEMEN INDONESIA. Pada suatu hari di jam istirahat kantor, Kribo bosan lalu memutuskan untuk menjelajah twitter dan melihat sebuah akun NFT dengan profile picture NFT. Berniat iseng, Kribo mendownload Profile Picture akun tersebut dengan klik kanan-save image. Namun, Kribo sempat membaca deskripsi gambar NFT akun tersebut bahwa terdapat rahasia yang besar di dalam gambar tersebut. "Dipinggir, di bawah text sampai di deskripsi, dan yang terkunci, semua ada rahasia!" begitu tulisan status di akun NFT tersebut. Pantas saja harganya mahal! Kribo langsung cari-cari referensi di youtube dan mengekstrak rahasia gambar tersebut dengan kunci yang didapatnya.
  ​
  Namun itu masih angan-angannya. Bantu Kribo mendapatkan kunci rahasianya!
  ​
