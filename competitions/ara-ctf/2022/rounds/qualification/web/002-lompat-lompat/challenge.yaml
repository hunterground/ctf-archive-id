description: |-
  Diketahui sebuah perusahaan PAMA memiliki topologi jaringan sebagai berikut :

  ![ilustrasi](https://live.staticflickr.com/65535/52080456687_cd2e30e139_c.jpg)

  Tugas anda adalah mengambil flag.txt yang berada pada webserver karyawan, masalahnya webserver karyawan tidak memiliki IP Public, sehingga anda harus masuk ke dalam local network perusahaan PAMA untuk dapat mengakses webserver karyawan tersebut. Intel mengatakan pada webserver utama terdapat informasi mengenai IP Private webserver karyawan.

  Peserta hanya diperbolehkan untuk mengakses port seperti yang tertera pada gambar, dan tidak boleh mengubah, merusak, menambahkan ataupun mengganti file/setting yang terdapat pada masing-masing server (masuk ke ssh diperbolehkan, namun tidak boleh mengganti apapun, termasuk merestart/mematikan server). Peserta juga tidak diperbolehkan untuk melakukan port scanning (semua port yang diperlukan sudah diberitahu melalui gambar). Untuk bruteforce juga hanya boleh menggunakan wordlist yang sudah diberikan, jika anda belum menemukan wordlist di server, jangan bruteforce apapun. Segala bentuk pelanggaran akan ditindak oleh panitia.

  IP WebServer: http://128.199.223.190:8880
