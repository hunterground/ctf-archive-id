description: "I created my own pastebin and I named it SecureBin , it was built using Java because i love\
  \ Java and Many people use it ( 3 Billion Devices Run Java :o ) \n\n#### How to Use SecureBin\n\n**Generate\
  \ JWT Token**\n`curl -X POST <URL>/generate --data \"username=<USERNAME>\"`\n\n**Create Note**\n`curl\
  \ -X POST <URL>/create -H \"Authorization: Bearer <BEARER> --data \"data=<DATA>\"`\n\n**Access Note**\n\
  `curl <URL>/note/<ID_NOTE> -H \"Authorization: Bearer <TOKEN>\"`\n\n- \"admin\" said he has a gift for\
  \ you in his notes\n- the seed used on the server is not 1"
