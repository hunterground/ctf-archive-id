description: "Jeant Tirstan adalah defacer berkelas dari xxxh3ngkerzzz, dia diberikan tugas untuk melakukan\
  \ read team operation ke ARA TECH, sebuah perusahaan baru penyedia service cyber ranges di Sukolilo.\n\
  Setelah melakukan spionage terhadap ARA TECH berbulan bulan, akhirnya Jeant Tirstan menemukan bahwa\
  \ ARA TECH sedang merekrut banyak pegawai baru, salah satunya adalah Joy Gilbert. \nJoy Gilbert aka\
  \ \"joytech\" sekarang menjadi target nomer 1 Jeant Tirstan, Jeant sudah melakukan penyerangan mulai\
  \ phising, MITM dan segala cara sudah dilakukan tetapi Joy tidak pernah terkena jebakan batman tersebut.\n\
  Kini Jeant kelabakan dan berpikir untuk mencuri data sensitif langsung dari komputer Joy. Pada suatu\
  \ hari ia masuk ke rumah Joy dan mengambil image dari komputer Joy, sialnya OS komputer Joy adalah linux,\
  \ sedangkan Jeant hanya berpengelaman melakukan memdump forensic pada windows.\nKini kamu sebagai teman\
  \ satu kantor Jeant tapi beda divisi diminta untuk menemukan sensitive information dari hasil curian\
  \ Jeant.\n\nara2022{ip server ARA TECH_password komputer joy_default password ara tech_nomor hp pak\
  \ as3ng_second flag_third flag}"
