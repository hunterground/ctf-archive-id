description: |-
  Di pagi hari, ketika baru sampai di kantor Perusahaan PAMA, Anda diberikan oleh bos Anda sebuah halaman website pada alamat http://128.199.180.111:8888/.
  Ketika membuka halaman tersebut, Anda akan diberikan sebuah kotak dimana sebenarnya jumlah kotak yang tersedia ada 90 buah. Tugas anda adalah menemukan ke-90 kotak yang ada dan menyusun kotak-kotak tersebut sesuai dengan susunan yang diberikan pada website.
  Jika sudah tersusun maka anda akan mendapatkan clue untuk langkah berikutnya.
