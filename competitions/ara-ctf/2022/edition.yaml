notes: >-
  CTF ARA 2022, held by HMIT ITS. The A Renewal Agent 5.0 site lists ARA 2021, ARA 2022, and ARA 4.0 among
  the events HMIT ITS has run, and the ITS-hosted ARA 2022 webinar page confirms the 2022 cycle. The problem
  set comes from the SOAL-CTF-ARA-2022 repository, which describes itself as the supporting material for
  the CTF ARA 2022 Penyisihan and Final. No source states the competition dates, so both are null. The
  repository is published by a personal GitHub account rather than the ARenewalAgent-ITS organization;
  challenge names and flags are corroborated by a third-party writeup, and the edition is recorded as
  corroborated rather than verified. The repository publishes Flag.txt and flag files with the problems,
  matching the distribution of other archived events.
