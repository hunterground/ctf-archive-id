description: >-
  Spongebob adalah seorang koki yang setiap hari membalikkan daging diatas panggangan.  Kemudian dari
  daging tersebut ia susun sebanyak 3 tumpukan didalam roti yaitu tumpukan ke-1 selada, selanjutnya daging,
  dan keju. Suatu ketika restoran tempat ia bekerja kekurangan ke tiga bahan tersebut. Bantu spongebob
  untuk mencari ketiga bahan kemudian susun sesuai tumpukan dan lakukan pemanggangan.
