description: >-
  Untuk lebih mengamankan akun freefire ku aku menggunakan aplikasi secure password manager yang terbaru
  dengan algoritma enkripsi yang katanya lebih aman dibanding yang v1. Namun pada v2 key tersimpan secara
  jelas pada file stored.passwd dan aku takut seseorang dapat mengetahui passwordku berdasarkan key yang
  ada di sana , jadi aku menyembunyikan key1 untuk password akun freefireku di flashdisk. Sialnya aku
  flashdisk itu hilang dan tentunya aku tidak mengingat angka panjang itu hmm dan sekarang aku lupa passwordku
  juga. Apakah ada yang bisa membantuku mendapatkan passwordku kembali? tentunya agar aku bisa bermain
  freefire lagi!
