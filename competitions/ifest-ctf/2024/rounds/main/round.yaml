notes: >
  Eighteen challenges are archived for the main round across five categories: Cryptography 4,
  Reverse Engineering 3, Web Exploitation 4, Binary Exploitation 3, and Forensic 4. The set is
  the complete ifest-2024 directory of the PETIR CTF Archive (PETIRsec/ctf-archive) at commit
  056ebe3bda4644fcd3d148dc16c34baa92457ffd. The reverse challenge LinkedOut ships no binary in
  the source: the distribution points to an external Google Drive link that is recorded in the
  challenge provenance and in missing.txt rather than copied. Ten solver scripts found inside
  the challenge src/ directories were moved to the mirrored solvers/ paths.