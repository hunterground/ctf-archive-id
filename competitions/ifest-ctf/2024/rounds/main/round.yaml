description: >
  Single-stage IFEST CTF 2024 round. The PETIR CTF Archive ships the 2024 challenges as a
  flat category set with no qualification/final split, and no primary source documents a
  distinct stage for 2024, so one round is used rather than inventing qualifier and final
  rounds.
