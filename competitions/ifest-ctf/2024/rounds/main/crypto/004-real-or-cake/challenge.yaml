description: 'The organizer description, kept verbatim, jokes about forgetting to make the problem after

  returning from Gemastik. The README explains the intended solution as a partial discrete

  log where small orders combine to recover x mod k, y mod k, and z mod k, letting the

  participant verify that x*y == z. The distribution is chall.sage and output.txt.

