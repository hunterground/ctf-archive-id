description: 'The organizer description, kept verbatim, is a hint that "yesterday Aeshowspeed came to

  Indonesia" (a play on the recent AES-encryption live demonstration). The distribution is

  aeshowspeed.py and flag.png.enc, an AES-CBC image encryption: the participant knows the

  key and IV used by the encryptor and only needs to turn the script into a decryptor to

  recover the flag image.

