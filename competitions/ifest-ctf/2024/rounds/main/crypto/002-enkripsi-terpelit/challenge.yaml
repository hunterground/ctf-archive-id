description: 'The organizer description, kept verbatim, laments that the encryption may only be run

  twice ("only two encryptions allowed"). It is a "two dimensional CRT" challenge: the

  participant has two chances to read an encrypted secret and must guess its contents within

  35 seconds using two-dimensional CRT theory. The distribution is enkripsiterpelit.py, and

  the challenge was served over netcat at 157.230.38.61:1043.

  '
