description: 'The organizer description, kept verbatim, asks what items are in the "bazaar". It is a

  modified ElGamal encryption: a relation between the nonces of two ciphertexts makes the

  secret number for the encrypted flag retrievable because the first ciphertext is known.

  The distribution is chall.py and output.txt. The README points to src/solve.py for the

  solve script and to the ElGamal article.

  '
