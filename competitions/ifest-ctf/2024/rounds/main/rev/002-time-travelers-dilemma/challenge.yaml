description: 'The organizer description, kept verbatim, asks for help with little time left. The README

  explains this is time travel debugging: the participant imports the given

  session.chunked.pycrunch-trace into the pytrace web app, collects the answers to the

  questions, and feeds them to the service to get the flag. The distribution is questions.txt

  and session.chunked.pycrunch-trace, served over netcat at 157.230.38.61:14041.

  '
