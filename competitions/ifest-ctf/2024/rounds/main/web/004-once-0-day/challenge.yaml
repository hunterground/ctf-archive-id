description: 'The organizer description, kept verbatim, asks how hard it is to hack a WordPress site.

  The README documents two chained vulnerabilities: an unauthorized user-registration bypass

  in the mstore-api plugin and a remote code execution in the woocommerce-products-filter

  (HUSKY) plugin, leading to a webshell. The distribution is challenges.zip, served at

  157.230.38.61:3311.

  '
