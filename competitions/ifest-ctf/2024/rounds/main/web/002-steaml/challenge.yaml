description: 'The organizer description, kept verbatim, calls SteaML the world most biggest game

  community. The README explains the solution: a login request with a password object

  {not: ''a''} makes the database query an admin user with a password not equal to ''a'', an

  injection that leaks the flag. The distribution is steaml.zip, served at 157.230.38.61:3221.

  '
