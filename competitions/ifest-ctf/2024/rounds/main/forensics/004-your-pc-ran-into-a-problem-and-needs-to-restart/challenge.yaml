description: 'The organizer description, kept verbatim, is about hitting a blue screen while doing work

  and needing to find out what happened. The README documents a Windows memory-dump analysis:

  the participant answers questions from the bsod.dmp using WinDbg (capture date, bug check

  code, terminated process, kernel version, exception handler address). The distribution is

  bsod.dmp and chall.txt, served over netcat at 157.230.38.61:11511.

  '
