notes: >
  Eighteen IFEST CTF 2024 challenges are archived in a single main round from the PETIR CTF
  Archive (PETIRsec/ctf-archive), which ships the 2024 challenges as a flat category set
  (Cryptography 4, Reverse Engineering 3, Web Exploitation 4, Binary Exploitation 3, Forensic 4)
  with no round or division split, so the round is modeled as single-stage. The source
  repository declares no license; per archive curation policy licensing is treated as MIT.
  The reverse challenge LinkedOut distributes no binary and points to an external Google
  Drive attachment recorded in missing.txt rather than copied. Ten solver scripts found in
  challenge src/ directories were moved to the mirrored solvers/ paths.