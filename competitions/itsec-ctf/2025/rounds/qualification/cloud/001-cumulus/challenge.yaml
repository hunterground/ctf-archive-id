description: "CloudTech is a new startup that just launched its company landing page to attract investors\
  \ and showcase its vision. The site is simple and static, hosted entirely on AWS. With a tight deadline,\
  \ the team rushed the deployment and may have overlooked some security best practices. Your task is\
  \ to investigate the website and check if there are any misconfigurations or vulnerabilities. \n\n<a\
  \ href=\"https://d16nohi04dvwd6.cloudfront.net\">CloudTech Landing Page</a>\n\nFlag Format: ITSEC{.*}"
