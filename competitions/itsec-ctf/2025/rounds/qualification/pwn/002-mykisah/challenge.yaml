description: 'Despite being adjacent to one another, Chidori Public High School and the all-girls Kikyo
  Private Academy seem to exist in two different worlds. While the latter boasts an immaculate reputation
  and favors students from wealthy backgrounds, the former is a nest for dim-witted delinquents. Everyone
  at Kikyo harbors a deep hatred for their Chidori neighbors.


  Sixteen-year-old Rintarou Tsumugi is a student at Chidori whose intimidating face leads people to avoid
  him. Rintarou pays no mind to this, as he is content with his group of friends. However, there is something
  he has not told them yet: sometimes, he helps out at his family''s cake shop.


  One day at work, Rintarou sees a customer at a table, but she runs off before he can talk to her. The
  next day, he receives an apology from the girl, Kaoruko Waguri, who explains that she did not run away
  because of his appearance and that she believes Rintarou is a kind-hearted person. Although he is not
  used to Kaoruko''s bright personality, Rintarou looks forward to forming a friendship with her. There
  is just one obstacle that stands in his way: Kaoruko is a Kikyo student!


  [Written by MAL Rewrite](https://myanimelist.net/anime/59845/Kaoru_Hana_wa_Rin_to_Saku)


  Connection: nc 13.250.98.246 40003'
