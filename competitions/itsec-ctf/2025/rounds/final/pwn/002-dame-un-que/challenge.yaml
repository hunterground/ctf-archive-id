description: 'Sorry it had to be windows again, but I read too much STARLABS writeups recently and I just
  can''t help myself.


  There''s no connection, once you have managed to exploit it locally, feel free to open a ticket and
  send your exploit and the author will validate it manually.


  The challenge will be ran againts Windows 24H2, the same environment with the distributed VM attachment
  yesterday. It runs with Low Integrity Level and no Antivirus enabled, there''s no flag, your objective
  is to escalate privilege to Administrator or NT/Authority System.'
