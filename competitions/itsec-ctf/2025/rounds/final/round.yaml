notes: >
  13 challenges across seven categories: Binary Exploitation (2), Blockchain (2), Cloud (2),
  Cryptography (1), Digital Forensics (2), Reverse Engineering (2) and Web Exploitation (2). One of
  them, "Damn, I Love PHP!", is the same challenge as the qualification one re-run with a different
  service address, and the source keeps it in both stage directories.

  Delivery is left unknown. The organizer announcement gives only the final dates and the finalists
  announcement date, and the sources located during this pass do not state whether the finalists
  played remotely or in person. The summit itself ran 26-28 August 2025 at The Ritz-Carlton Jakarta,
  Pacific Place, which is after the final, so the summit venue is not evidence of the final's
  delivery. The 09:00-19:00 WIB window each day comes from the first-place team's announcement. The
  organizer does not publish the number of finalist teams, so participant_count is null.
