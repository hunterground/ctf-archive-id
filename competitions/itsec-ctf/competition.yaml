notes: >
  This is the PT ITSEC Asia competition. The 2025 summit page describes the CTF as a new
  addition, and no earlier or later ITSEC Asia CTF edition was found.

  The 2025 edition is the first recorded edition and the only one archived. Its challenge set is
  published by the organizer in ITSEC-ASIA-ID/2025-ITSEC-Asia-Summit-Public under final directory
  names Qual and Final, and every 2025 challenge in this archive comes from that repository. The
  competition lead's wrap-up post describes the set as jeopardy-style, which is the basis for
  formats. `recurring` is left null because the organizer has not stated whether a later edition is
  planned.
