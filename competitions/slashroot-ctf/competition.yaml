notes: >
  The 2023 registration announcement names www.slashrootctf.id as the official site. The jeopardy
  format is stated by the organizer's SlashRoot 7 problem-set repository. The newest organizer article
  found in this pass is SlashRoot CTF 8.0 in 2024, so the series status is left unknown. The previous
  record listed only 2023. Challenge materials for the 2023 and 2024 editions are imported from the
  organizer repositories and recorded in archives/repositories.yaml. That file also registers the
  secondary sources that were not imported and are left for human review, namely the TCP1P RSCTF
  re-distribution of the 2024 set, author repositories by Ganes556 and indravscode for earlier
  editions, the mentimun-mentah platform for SlashRoot 5, and the d4em0n writeups for SlashRootCTF 2.0.
  The 2022 edition still has no challenge materials imported.
