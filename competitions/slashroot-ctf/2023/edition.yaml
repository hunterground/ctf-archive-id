notes: >
  Qualification on 30 September 2023. Seminar and awarding on 4 November 2023. The organizer
  problem-set repository separates penyisihan (qualifier) and final, which is the round structure
  used here. The 46 imported challenges are the 28 qualifier and 18 final directories in that
  repository. Its README problem tables list 26 qualifier and 18 final problems; RGX1337 and
  SangChall have directories and appear in the organizer points recap but not in the README
  qualifier table, and that recap also names Feedback and Welcome, which have no directory. The
  repository is MIT licensed and its LICENSE is preserved at competitions/slashroot-ctf/2023/LICENSE,
  since it covers both the qualifier and the final.
