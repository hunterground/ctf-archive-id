notes: >-
  Author challenge archived from the Techcompfest-2022 directory of dimasma0305/My-CTF-Challenges.
  The edition year and event identity are uncertain: the source directory is named for 2022, but
  this challenge and one other in the tree carry TECHCOMPFEST2023{...} flags, and official records
  state that the 2022 Techcomfest ran Networking, Software Development and Short Movie
  competitions with the 2023 event held on 21 January 2023. It is therefore recorded under the
  2023 edition pending maintainer confirmation. The source README records a flag, which is not
  reproduced here; flag files in the distribution are archived as-is. Difficulty is the rating the
  author published in the README, computed with their own ctf-challenge-difficulty-calculator
  site.
