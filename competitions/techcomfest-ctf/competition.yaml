notes: >-
  Event Identity & Naming
  - Unified Event: Spelling variations across official sites, CTFtime, and Politeknik Negeri Semarang agendas
    (Techcomfest, Techomfest, and TECHOCOMFEST) all refer to the same event organized by UKM Polytechnic Computer Club (later written as UKM PCC). 
    A prior candidate lead treating TECHOMFEST as a separate event is resolved, while TechnoFair remains a distinct competition.

  Competition History & Structure
  - 2020-2021: Did not include Capture the Flag competitions.
  - 2022: Featured three main tracks (Networking, Software Development, Short Movie) alongside 
    a single archived CTF challenge (Yet Another Python SSTI Challenge).
  - 2023-2026: Established as a recurring CTF (with the 2023 final held January 21, 2023, at Politeknik Negeri Semarang 
    for 53 teams, and the 2024 edition documented on CTFtime as a Jeopardy qualifier with an onsite final). 
    The TCP1P team served as the recurring problemsetter across all four editions.
