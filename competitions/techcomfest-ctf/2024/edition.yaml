notes: >-
  Ten challenges were imported from the TECHCOMFEST-2024 directory of the author repository
  dimasma0305/My-CTF-Challenges (Dimas Maulana, MIT-licensed). The source organises challenges into
  Warmup, Quals, and Final stages, mapped to warmup, qualification, and final rounds respectively. The
  CTFtime listing describes the 2024 competition as jeopardy with a qualification and an onsite final.
  Warm-up and qualification dates are inferred from the parallel Techcomfest 2025 schedule (21 December
  warm-up, 28 December qualification, 20 January onsite final); start/end above are the inferred bounds.
  The warm-up web challenges Your Name and Your Name Revenge carry TCF2023{...} flags in the source,
  suggesting they were reused from the prior year; this is recorded in their challenge notes.
  A problemsetter repository, TCP1P/TECHCOMFEST2024, is also confirmed. It contains 30 challenges
  across the three rounds, including categories not imported here from the author repository
  (Cryptography and Reverse Engineering in Warmup and Quals, plus the whole Final round except the Web
  challenge challenge-kepepet). Importing those remaining challenges is an open follow-up.