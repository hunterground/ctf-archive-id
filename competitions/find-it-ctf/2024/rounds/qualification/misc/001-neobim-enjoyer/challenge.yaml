description: Quandale Dingle ingin menghadiri acara EliteCoder Rizz Party, namun dia belum sigma. Salah
  satu syarat untuk menjadi sigma di kalangan Rizzler adalah dengan menggunakan NeoVim dan Arch Linux.
  Quandale sudah menggunakan Arch linux namun belum pernah menggunakan NeoVim. Para Rizzler yang sudah
  sigma mengetes Quandale Dingle dengan memberikan sebuah NeoVim plugin (github.com/dundorma/neobimenjoyer)
  yang didalamnya terdapat pesan tersembunyi. Bantulah Quandale Dingle untuk menginstall plugin dan menemukan
  pesan tersembunyi tersebut. (wrap the flag in FindITCTF{})
