description: 'One day, Asep wanted to contact me via a popular social media platform in Indonesia. However,
  he found something intriguing and took a screenshot: he discovered many Suzuki cars in there. He asked
  me to find the name among them that has the date "2024-03-13 05:58"

  FLAG =  FindITCTF{NAME}

  Hint:

  - Sometimes you should "twist" your brain

  - website medsos populer di indonesia tapi perhatikan clue sebelumnya 👍

  - Mungkinkah Asep salah ketik di keyboard dia?

  pantas saja perusahaan besar banyak beli domain untuk 1 produk saja. Jika saja aku tahu Asep ada dimana
  mungkin sudah bisa kutebak pertanyaan dia 😭.

  - ga ada hubungan sama sekali dengan pribadi manapun

  - Mungkin saja abang elceef bisa membantu kita dengan tools dia :(

  > kalau masih ga ketemu berarti ini bukan takdir kita

  > last hint'
