notes: >
  The Taalenta account gives 14 May 2023 as the qualification date and does not state an end
  date, so only start is recorded. The organizer repository groups the qualification pool into
  Cryptography, Forensics, OSINT (Open-Source Intelligence), Others, PWN (Binary Exploitation),
  Reverse Engineering, and Web Exploitation. Each source directory maps to the archive category
  crypto, forensics, osint, misc, pwn, rev, and web respectively; the original labels are kept in
  original_category. Sequence numbers follow the order the organizer repository lists each
  category. Solver scripts and solver screenshots shipped alongside the challenges were moved to
  solvers/competitions/find-it-ctf/2023/ as required by archive policy and are not listed as
  preservation omissions.
