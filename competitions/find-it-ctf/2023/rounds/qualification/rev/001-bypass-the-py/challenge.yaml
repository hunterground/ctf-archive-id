notes: |
  Organizer-published challenge pool for the 2023 preliminaries. The source README gives the challenge description, the score, and (where stated) the author's Discord handle; those are recorded as-is. The README also gives the published flag, so flag text is not repeated here. Solver material (solver files) was moved to solvers/ per archive policy and is not listed as a preservation omission. The source ships a PyInstaller build/ and dist/ tree; both are part of the distributed reversing binary and are preserved unchanged.
