notes: >
  The Taalenta account gives 3 June 2023 as the final date and the organizer repository publishes
  the final pool under challenge-pools-final-collab, described there as the final round with
  collaboration from Taalenta and Cyberkarta. Eleven challenges are archived: five in the
  Taalenta tree and six in the Cyberkarta tree. The Taalenta README lists its five challenges with
  author and tags, which are recorded as stated. The Cyberkarta tree ships organizer-facing
  deployment material under untuk_panitia rather than participant distributions, and it is
  preserved unchanged; rev_paminfla and the five web challenges carry no description or score in
  the source, so those fields stay null rather than being reconstructed from the solving steps.
  Sequence numbers follow this archive's alphabetical source order within each category. The
  source does not state a delivery mode for the 2023 final; delivery is recorded as online from
  the organizer FAQ for a later edition and should be treated as needs-review if a 2023-specific
  venue statement surfaces.
