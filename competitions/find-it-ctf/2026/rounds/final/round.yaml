notes: >
  No organizer statement was located for the 2026 final's date or venue, so both
  date fields stay null and delivery is unknown; the .gzevent files in the source
  carry 2026-01-10 to 2026-01-12, but that block is the untouched gzcli template
  sample (its summary reads "example summary" and its organization reads "Miku fans
  club"), so it is not used as an event date. A 2026 participant award notice places
  recognition in May 2026, consistent with a final after the May preliminary. The
  TCP1P::CTF practice mirror describes itself as imported from TCP1P/findit-ctf-2026,
  which corroborates that this repository is the challenge set used for the event.
  Six challenges carry a challenge.yml at the event-time commit. Solver material was
  moved to solvers/competitions/find-it-ctf/2026/ and is not a preservation omission.
