notes: Author-side source. The challenge.yml names Dimas Maulana as the author, declares category Web,
  and gives difficulty 5 with no separate point value, so the organizer difficulty rating is recorded
  as-is; it is not comparable to the 1000-point values other challenges in this set carry. The flagTemplate
  uses a per-team hash placeholder, which is kept out of the metadata. Both the src/ application tree
  (Flask app and Electron bot with its preload sources) and the dist/ archive are preserved. The source
  solver/ directory was moved to solvers/competitions/find-it-ctf/2026/ and is not a preservation omission.
  src/.env holds only DOMAIN=1pc.tf and is preserved because it ships with the distribution.
