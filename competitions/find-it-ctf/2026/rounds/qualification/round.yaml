notes: >
  The organizer timeline announced Capture The Flag among the 2026 branches and kept
  registration open through 28 February 2026, but gave no round dates, so both date
  fields stay null. A 2026 finalist account describes the preliminary round as a
  single 24-hour online round held in May 2026 with 1,428 teams; that is a participant
  statement and is not recorded as an organizer date. The four challenge directories
  are the only entries under quals/ that carry a challenge.yml at the event-time
  commit; every other category holds only a .gitkeep placeholder. Solver material
  shipped alongside the challenges was moved to
  solvers/competitions/find-it-ctf/2026/ and is not listed as a preservation omission.
