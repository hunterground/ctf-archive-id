notes: >
  The organizer timeline announced Capture The Flag among the 2026 branches with
  registration through 28 February 2026 but stated no competition dates, so the
  edition dates stay null. Ten challenges are archived from the author-side event
  repository TCP1P/findit-ctf-2026 at commit
  164d9ca0bc635bef5133228a310fc2e0fc3b5773, the last commit before the repository
  was refactored to dynamic containers: four in the qualification pool and six in the
  final pool. The repository is a primary source in the sense that its authors and
  committers are the challenge authors themselves (Dimas Maulana, Etynslop, m3rr,
  Marc, buwung ap tu man, and others), and each imported challenge records the author
  named in its challenge.yml. Organizer-side corroboration is the Find IT UGM GitHub
  organization's 2026 writeup repositories and the TCP1P::CTF practice mirror, which
  states it was imported from this repository. The organization CTF-Find-IT-2023 also
  published the 2023 pools, but no organizer-run 2026 challenge repository exists.
  The source has no LICENSE file; on 2026-11-25 the archive maintainer instructed that
  a source with no license file be treated as MIT for this import. Source deployment
  material (src/, dist/, .gzevent, .example/, .agents/) is preserved verbatim as part
  of each challenge distribution. The repository's .example/ and .agents/ template
  trees are tooling rather than challenge material and were not copied into any
  challenge. Participant writeups and challenge collections for this edition were
  noted for review, not imported.
