notes: 'Because HackToday 2024 lacks an official organizer repository, its archive was reconstructed from participant writeups and files. 
  The event used a Jeopardy format across a warm-up (August 17, 2024), qualification (August 24, 2024), and an onsite final (September 21, 2024), 
  verified via archived HIMA IF Telkom University records.

  Imported Challenges & Categories
  - Total Imported: 22 challenges (3 warm-up, 17 qualification, 2 final) spanning six categories: crypto, forensics, misc, pwn, rev, and web.
  - Omissions & Exclusions: Four attested challenges (Ceremony, Baby Slim, Sanitizer, and Hadiah kemerdekaan) could not be imported due to 
    missing files. Defacer Enjoyer was removed because only solver artifacts existed, and two warm-up challenges (Easy RSA, unknown leak) 
    were excluded due to ambiguity with previous years events.
  - Attribution & Metadata: Because official attribution and difficulty ratings are missing, challenges use participant handles as authors, 
    curator-written descriptions/categories where necessary, and an assigned MIT license.

  Preservation & Fidelity Audit
  - Distribution Completeness: Challenge fidelity varies—only one (note to self) is a complete containerized setup, while others consist of binaries, 
    standalone scripts, or forensics artifacts. DumpTheSecret is kept as a metadata-only record, and examination is incomplete due to a missing flag.txt 
    required by its Dockerfile.
  - Artifact Separation: An audit on November 26, 2026, separated solver-generated outputs (such as GDB histories, ROPgadget dumps, and intermediate 
    image repairs) into solvers/ directories while restoring genuine organizer files that were initially misclassified (Pentathlon finish.png and 
    Foren Technical Test top-secret.docm).
  - Flag Handling: Eight of the eleven remaining flag.txt files contain real captured flags rather than placeholders; they were kept in place to preserve 
    distribution checksums.'
