notes: >-
  The date comes from the published IT Today 2024 timeline: finalists were announced on
  7 September 2024 and the Babak Final and Awarding Night were held on 21 September 2024. Delivery
  is recorded as onsite because the accompanying awards publication describes an in-person final
  and awarding night, not because a per-challenge statement says so. Only two final challenges
  are attested, both PWN, from a single participant archive; the source README for that directory
  is titled "HackToday CTF Qualifier 2024" although the files sit in a finals directory and one of
  them is described there as a final challenge. No forensics, cryptography, web, or reverse
  engineering final challenge was located, so the final challenge count here is a floor, not the
  total.
