notes: >-
  The date comes from the published IT Today 2024 timeline, which lists Warm Up on 17 August 2024.
  Only three warm-up challenges are imported. The participant archive also holds Easy RSA and
  unknown leak in its warmup directory, but both names are also used by HackToday 2022 and 2023
  and no writeup ties them to 2024, so they were excluded on maintainer review rather than
  attributed to this edition. No organizer repository exists for this stage, so the imported
  material is a participant copy. Difficulty is not stated upstream. Category is unknown for all
  three, because no source states it and the archive does not guess; curator classification was
  avoided rather than risk a wrong category.
