notes: |-
  Warm-up challenge. Category is not stated by any source; forensics is the curator
  classification from the distributed material. The organizer distribution is the deliberately
  corrupted 300x200 PNG `H4H4...kn0w.png` (its IHDR CRC is invalid, which is the puzzle) plus
  the base64 payload `please_dont_open_it.txt`, which decodes to the hex dump `file.txt`.

  Three further files in the upstream directory are participant solve output, not distribution,
  and were moved to solvers/: `file.txt` (the decoded hex), `fixedfixed.jfif` (the JPEG that hex
  produces), and `fixed_2.png` / `fixed_2_fixed.png` (the solver's repaired copies, one of which
  uses a 300x10000 canvas). Verified by re-deriving each: base64 of `please_dont_open_it.txt`
  reproduces `file.txt` byte for byte, and hex-decoding `file.txt` reproduces `fixedfixed.jfif`
  byte for byte. None of it is organizer material.

  Provenance caveat: this challenge material was obtained from a participant writeup repository
  (see provenance), not from the organizer or the challenge author. The artifacts appear to be
  the original distribution, but this copy is not an authoritative organizer source. It may be
  cleaned up or restructured in a later pass.
