notes: |-
  Qualification challenge. Both writeups discuss it under Reverse Engineering, and one captions
  the binary as Rust; the event label is rev even though the technique is cryptographic. The
  only challenge artifact is the `AtLeast` ELF binary. A `.gdb_history` in the upstream directory
  records a solver session (`info functions`, `disas main`, `q`) and is participant material, not
  distribution, so it was moved to solvers/.

  Provenance caveat: this challenge material was obtained from a participant writeup repository
  (see provenance), not from the organizer or the challenge author. The artifacts appear to be
  the original distribution, but this copy is not an authoritative organizer source. It may be
  cleaned up or restructured in a later pass.
