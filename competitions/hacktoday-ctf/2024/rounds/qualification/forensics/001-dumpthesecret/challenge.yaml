notes: |-
  Qualification challenge. Category follows the evanaff writeup, which labels it Digital Forensic,
  and the KEITO writeup Forensics section.

  This is a metadata-only record for missing material, updated on 2026-11-26. No challenge
  distribution is archived. The real distribution, per the evanaff writeup, was a Windows Event
  Trace Log memory image named chall.raw containing secret.rar and hint.txt. None of that exists
  in any located source, and the Drive link the writeup cites now returns 404.

  The directory previously held three files, all participant solve output rather than distribution:
  filedump.dmp was 1988 lines of Volatility 3 windows.filescan text output (a scan report, not the
  memory image), hash.txt was one cracked hashdump line, and flag.zip was an encrypted archive with
  an undocumented password. All three were removed and are recorded in preservation.omissions. Their
  removal is why preservation.modified is true.

  What a future recovery needs: chall.raw, secret.rar, and hint.txt. Without them this challenge
  cannot be presented or solved.

  Provenance caveat: this challenge material was obtained from a participant writeup repository
  (see provenance), not from the organizer or the challenge author. The artifacts appear to be
  the original distribution, but this copy is not an authoritative organizer source. It may be
  cleaned up or restructured in a later pass.
