notes: |-
  Qualification challenge. Category follows the evanaff writeup, which labels it Forensics, and
  the KEITO writeup Forensics section. This is a real five-stage distribution, not a writeup
  artifact: the stages are `chall1.png`, `chall2.jpg`, `chall3.zip`, `chall4.png`, `chall5.png`
  and `chall5.zip`, and each unlocks the next. `script.py` is the organizer stage-4 encoder, and
  it ships both loose and inside the password-protected `chall3.zip`, so it stays in original/.
  `chall3.zip` carries `flag3.txt`, `chall4.png` and `script.py`; `chall5.zip` carries `chall5.png`
  and `finish.png`. Both are password-protected, and the password travels in the preceding stage.

  Provenance caveat: this challenge material was obtained from a participant writeup repository
  (see provenance), not from the organizer or the challenge author. The artifacts appear to be
  the original distribution, but this copy is not an authoritative organizer source. It may be
  cleaned up or restructured in a later pass.
