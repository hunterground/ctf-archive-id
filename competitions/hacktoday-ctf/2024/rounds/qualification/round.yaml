notes: 'The date comes from the published IT Today 2024 timeline, which lists Babak Penyisihan on 24 August
  2024. The category set is attested by two independent writeups: the KEITO qualification PDF groups challenges
  under Forensics, Cryptography, Misc, Web Exploitation, and Reverse Engineering, and the HCS (Girls Band
  Cry) PDF covers Web Exploitation, Reverse Engineering, and PWN. The event used Jeopardy format for both
  the qualification and the final per the organizer description. No organizer repository exists for 2024,
  so all imported material is a participant copy. Challenge count reflects the 20 challenges actually
  imported, not the total the organizer ran; the full set is unknown, and Ceremony, Baby Slim, Sanitizer,
  and the bonus Hadiah kemerdekaan are attested only in writeup prose and were not imported because no
  distribution was located.'
