notes: >-
  The IT Today 2025 announcement schedules the HackToday series across 2 August to 27 September
  2025 and names 27 September 2025 for the competition finals and awarding, but it does not date
  the qualification round. The qualification dates are therefore left null rather than inferred
  from the series start. Qualification challenge commits in the organizer repository fall mainly
  between 2025-08-03 and 2025-08-10, with a later cluster on 2025-09-17 and 2025-09-18.
