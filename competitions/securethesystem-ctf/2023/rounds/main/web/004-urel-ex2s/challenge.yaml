description: |-
  **Author**: `Dimas`

  Have you heard the exciting news? The little princess has just created a website for fellow
  GT fans to connect and chat! Before the official launch, we want to ensure a secure experience
  for everyone. Could you help us by testing it for potential XSS vulnerabilities? We want to
  make sure her fans don't encounter any issues with data security, especially from those pesky
  Android robots.
