notes: >-
  Identity
  - Distinct Event: IT FEST Micro IPB is organized by the Himavo Micro IT Community, the student
    association of Sekolah Vokasi IPB University. It is not the IFEST CTF organized by HIMATIF FMIPA
    Universitas Padjadjaran that this archive already holds under ifest-ctf. The two share an
    abbreviation and nothing else, and stay separate competitions.
  - Name Variants: Public material writes the event as IT FEST 2025, ITFest Micro IPB, and ITFEST IPB
    interchangeably, while the repository README only says "Repo soal microCTF 2025". The recorded name
    keeps the official wordmark form.

  Publisher & Lineage
  - Publisher Not Organizer: The challenge repository is published by the Cyber Security IPB GitHub
    organization, the same publisher as the HackToday and Agrihack repositories in this archive, and its
    members wrote these challenges. The competition itself belongs to the Himavo Micro IT Community.

  Scope & Open Questions
  - Established Year: An IT Fest Micro IPB 2024 is attested, but only for its hackathon and seminar
    tracks. No 2024 CTF is attested, so no 2024 edition directory was created.
  - Only 2025 Is Archived: The 2025 edition is the only one with an organizer challenge source.
  - Licensing: No license file is published. Every imported challenge records redistribution as
    permitted under the standing archive maintainer instruction for license-less sources.
