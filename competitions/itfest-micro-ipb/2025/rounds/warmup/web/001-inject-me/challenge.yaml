notes: >-
  This directory mixes two generations of organizer files. README.md and the flag file describe the IT FEST 2025 challenge Inject Me!, while challenge.yml is a stale CtfD config left from Agrihack 0x08 that still names the challenge comin, credits ardhani, and carries the old agrihack{...} flag. Both are preserved verbatim and the archive takes the challenge name from the current README. The PHP application is the same one archived as agrihack-ctf-2023-qualification-web-005 (comin), restyled.
