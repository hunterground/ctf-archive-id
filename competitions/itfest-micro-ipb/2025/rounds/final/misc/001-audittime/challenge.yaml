notes: >-
  A blockchain challenge deployed on the TCP1P blockchain infrastructure; the organizer README calls it Blockchain - Audit Time and its description field is the literal placeholder todo..., preserved rather than invented around. Its contract tree is identical to the HackToday 2025 qualification challenge this archive already holds as hacktoday-ctf-2025-qualification-misc-001, with only the flag and service port changed; it is imported here as the IT FEST 2025 publication with that lineage recorded. images/ is the shared TCP1P blockchain launch infrastructure shipped inside the challenge, including a compiled Next.js frontend, and is preserved because it is part of the distribution rather than a cache. images/challenge/solana-deps/tests/exploit.ts is TCP1P scaffold starter code shipped to participants, not an author solution, so it stays in the distribution.
  The forge-std and openzeppelin-contracts submodules declared in the repository .gitmodules under lib/ are absent from both the committed tree and the clone.
