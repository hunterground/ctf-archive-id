notes: >
  Event Overview & Dating
  - NETCOMP 2.0 (2024): The overall program ran from September 2023 to February 2024, 
    featuring an online CTF qualifier and an offline Boot2Root final held February 3-4, 2024, 
    at Sekolah Vokasi UGM (closing announcement on February 8, 2024).
  - Calendar Classification: Previously labeled an unverified "NETCOMP 2024," the edition is 
    formally filed under 2024 because the final and closing announcements occurred in February 2024 
    (the September 2023 start belonged to a seminar, and exact qualifier start dates are unrecorded).

  Imported Challenges & Verification
  - Total Imported: 23 challenges (18 online qualification, 5 warm-up).
  - Corroborated (16 challenges): Verified against an independent participant collection—15 match byte-for-byte 
    (including all 5 warm-up challenges, with their served flags recorded), and Webfuscate matches via its served flag.
  - Unverified / Author-Only (7 challenges): Rely solely on the author's archive (dynamictype, pwn, netcomon, 
    Learning, Packet, File Downloader, and Static Web). Static Web is flagged for scope review (needs_scope_review) 
    because its flag uses a netcomp23{...} prefix.
