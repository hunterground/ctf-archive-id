notes: >
  This edition is the NETCOMP 2.0 program, whose activities ran from September 2023 to February
  2024. The organizer page was published on 7 December 2023 and the closing announcement on 8
  February 2024; a participating school reports the onsite final on 3 and 4 February 2024 at the
  Teknologi Rekayasa Internet program, Sekolah Vokasi UGM. Only the end date is recorded because no
  source states when qualifiers opened, and the September 2023 start belongs to the seminar, not the
  CTF. The edition is filed under 2024 rather than 2023 because the final and the organizer's result
  announcement fall in 2024, matching how this archive files NETCOMP 3.0 under 2025 from its
  January-February 2025 run. The previous archive record described this year as "NETCOMP 2024" and
  left it unverified because NETCOMP 2.0 had not been tied to a calendar year; the organizer and
  participant sources above tie it to February 2024. The cybersecurity competition was Capture the
  Flag with an offline Boot2Root final. Twenty-three challenges were imported: eighteen in the
  online qualification round and five in a warm-up set. Sixteen are corroborated against an
  independent participant collection: fifteen ship the same files byte-for-byte, including all five
  warm-up challenges, and web Webfuscate matches on its served flag. That collection also records the
  NETCOMP flags the warm-up set was served with. Seven challenges rest on the author archive alone:
  pwn dynamictype and pwn, rev netcomon, forensics Learning and Packet, web File Downloader, and web
  Static Web. Static Web also remains needs_scope_review because its flag uses the netcomp23{...}
  prefix.
