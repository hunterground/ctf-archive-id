notes: 'This challenge has no README in the source, so description, difficulty, and author stay null. src/main.c holds the note manager with a helper stack pivot. The checker script checker/xpl.py is the author''s exploit, not part of the released deployment, and was moved to the mirrored solvers/ path. Corroborated as NETCOMP 2.0 material by an independent participant collection: The released chall binary is byte-identical to the participant copy, which files it as Pwn/chall.'
