notes: 'The README in this directory is a stale byte-identical copy of the _warmup/Web README: it titles
  the challenge ''Remote Code Execution'' and carries a TNIAL{Remote_Code_Execution_aka_RCE} flag, so
  it does not describe Webfuscate and is not used for the name, difficulty, or author, which stay unset.
  The name comes from the directory and the participant write-up, which gives the description and reports
  the same netcomp{easy_php_obfuscation_shell} flag that server/flag.txt holds. The participant collection
  carries an obfuscated chall.php for this challenge whose deployed form differs from the preserved server/src/index.php,
  but both reach the same netcomp{easy_php_obfuscation_shell} flag, so the challenge is corroborated by
  flag match rather than file identity.'
