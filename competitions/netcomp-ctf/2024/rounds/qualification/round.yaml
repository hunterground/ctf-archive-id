notes: >
  The organizer's NETCOMP 2.0 page labels the cybersecurity competition as Capture the Flag but
  gives no stage names or dates. A participant write-up places online qualification CTF challenges
  before the onsite final, and a school report dates the onsite final to 3-4 February 2024 in the
  Teknologi Rekayasa Internet program at Sekolah Vokasi UGM. Qualifier dates are not stated, so the
  dates object is null. The offline final used a Boot2Root format with machines supplied by
  Hacktrace; no final-round challenge files were located, so only this qualification round is
  archived. Sequence numbers follow the source order within each category directory. The source
  directory is named 2023-Netcomp-UGM because the NETCOMP 2.0 program year ran from September 2023
  to February 2024; the edition is filed under 2024, matching how the archive files NETCOMP 3.0
  under 2025. Only the three web challenges are independently corroborated as NETCOMP 2.0 qualifier
  challenges by a participant write-up; the remaining fifteen are recorded from the author archive
  and are flagged needs_scope_review where their event identity rests on that source alone.
