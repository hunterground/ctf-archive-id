notes: The source README gives no author and no difficulty, so both stay null; it does include a tshark
  one-liner for extracting the image. generate/ holds the image stager that produced the payload. The
  TSA Cyber Champion 2024 'Forensic 101' entry in this archive reuses this challenge's stager and solve
  output under a TSA flag, which corroborates the material's authorship but is a different event. This
  challenge does not appear in the participant collection that corroborates the rest of the set, so it
  rests on the author archive alone.
