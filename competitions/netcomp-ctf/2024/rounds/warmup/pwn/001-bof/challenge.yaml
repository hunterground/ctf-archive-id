notes: Beginner challenge from the source's _warmup set. An independent participant collection ships the
  same files byte-for-byte, which confirms the set was played under NETCOMP flags. That collection records
  the served flag as netcomp{pwn_binex_101}, matching the preserved server/flag.txt. The preserved README.md
  still carries a stale TNIAL{...} string from a TNI Angkatan Laut event; that string predates the NETCOMP
  re-flagging and is not the served flag. Which NETCOMP stage served the set is not stated by any located
  source, so the challenge stays under the warmup round pending organizer review.
