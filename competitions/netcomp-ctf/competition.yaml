notes: The NETCOMP 2.0 page describes the cybersecurity competition as Capture the Flag and was published
  on 7 December 2023 without competition dates. An ITS report places NETCOMP 3.0 from early January to
  early February 2025 and describes the final as Boot2Root. NETCOMP 4.0 was announced on the program site
