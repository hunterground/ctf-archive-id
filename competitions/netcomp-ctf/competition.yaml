notes: >-
  Event Timeline & Editions

  - NETCOMP 2.0 (2024): Announced December 7, 2023, with an onsite final held February 3-4, 2024. 
    This is the only edition in the archive with imported challenge materials.
  - NETCOMP 3.0 (2025): Ran from early January to an onsite Boot2Root final on February 2, 2025 (with 82 teams reported in the qualifier). 
    Because no official problem sets were located, its 11 qualification challenges and 2 final machines are documented solely from participant write-ups.
  - NETCOMP 4.0: Announced November 6, 2025, without scheduled dates, so no 2026 edition was created in the archive.

  Sourcing & Corroboration
  - External participant write-ups-including collections from teams Shelltatic, zenc, Wintertia, jonscafe, and SandWithCheese—were 
    referenced strictly to corroborate challenge details without copying their content directly.
