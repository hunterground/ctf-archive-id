notes: >-
  The NETCOMP 2.0 page describes the cybersecurity competition as Capture the Flag and was published
  on 7 December 2023 without competition dates. An ITS report places NETCOMP 3.0 from early January to
  early February 2025 and describes the final as Boot2Root; the organizer closing announcement and a
  participant achievements page place the onsite final on 2 February 2025, with 82 teams reported in
  the qualifier by one participant team. NETCOMP 4.0 was announced on the program site on 6 November
  2025 without a competition date, so no 2026 edition was created. The 2024 edition was later
  corroborated as NETCOMP 2.0, whose onsite final ran on 3-4 February 2024. Only the 2024 edition has
  imported challenge materials; NETCOMP 3.0 has no located organizer or author problem set, so its
  eleven qualification challenges and two final machines are documented from participant write-ups
  only. Secondary sources for NETCOMP challenge material exist outside this archive and were used only
  to corroborate, never to copy. They are the NETCOMP 2.0 write-up by team Shelltatic, the NETCOMP 3.0
  write-ups by teams nama yang gaje ketika dipanggil podium and Ini mas gw mau minta bntuan kali bisa
  di bantu di solv soal ctfnya buat konversi nilai ke sks, the zenc, Wintertia, and jonscafe write-ups,
  and the SandWithCheese write-up collection. Each is listed on the edition, round, or challenge where
  it was used.
