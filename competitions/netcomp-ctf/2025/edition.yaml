notes: >
  Event Overview & Statistics
  - Schedule & Venue: NETCOMP 3.0 ran from early January 2025 to an onsite final at the 
    Teaching Industry Learning Center, Sekolah Vokasi UGM, beginning February 2, 2025 
    (only the end date is recorded, as the qualifier window is unstated).
  - Categories & Participation: The final featured Networking and Capture the Flag tracks. 
    While a participant team reported 82 teams in the qualifier, the official participant count 
    remains null due to the lack of organizer verification.

  Documented Challenges (Write-ups Only)
  - Because no official or author problem set was located, no challenge files were copied; 13 challenges 
    are documented solely from participant write-ups (total challenge_count remains null, and quoted flags are omitted):
  - Qualification (11 challenges across 6 categories):
    - Crypto: "I swear this is not a web or reverse" (BerlianGabriel — JS S-box check)
    - Pwn: Intro (Linz — C++ vtable overwrite)
    - Rev: "good ol flag checker" (Lurifos — CPython 3.12 .pyc)
    - Boot2Root: Four Hacktrace-Ranges targets by y0xhz (Popo-User, Popo-Root, 232-User, 232-Root)
    - Web: Eznotes, Karbitan, and Karbitan V2
    - Forensics: "xxxxxxxxxxx" (Avilia — X11 protocol capture; 500 pts, 0 solves)
  - Final (2 Boot2Root machines): Infiltrate and Ancient (gRPC and web-persistence environments, each containing user and root flags).

  Attribution & Open Review
  - Author names are logged as "reported" rather than official, based on challenge descriptions quoted in write-ups.
  - Pending Decision: Reviewers must determine whether to import participant-held files from the SandWithCheese collection 
    (covering Intro, Eznotes, and Karbitan V2) if redistribution rights can be established.
