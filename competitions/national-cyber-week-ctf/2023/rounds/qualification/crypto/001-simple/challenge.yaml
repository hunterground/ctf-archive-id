description: |
  The source preserves no verbatim statement. The distribution is simple.py, an
  AES-CBC guessing service whose encryption routine body has been replaced by a
  comment block, and whose key is a static plainkey concatenated with eight
  repetitions of a two-byte os.urandom suffix. The key material is then itself
  wrapped by a second AES step whose mode the solver has to recover.
  
    Quote from the 2023 qualification statement, as recorded by two independent
    participant write-ups: a program asks the player to guess a code encrypted
    with AES-CBC under plainkey + os.urandom(2)*8, and plainkey was itself
    encrypted with an AES mode the player must identify.
  
  Corroborating write-ups: hackmd.io/@wondPing/S1lsfbEOVp and the IPB write-up
  WU_NCW23_anak_kemaren_sore.pdf. The challenge is worth 220 points.
