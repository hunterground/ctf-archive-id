notes: 'Qualification challenge, 320 points. The author handle and the statement are

  recorded by k1nomi''s write-up of the same challenge.

  The source tree groups the distributed client and server under dist/ and also carries

  dist/attacker.py, a man-in-the-middle client that tampers with messages between the two

  sockets. It is the write-up author''s solver, not part of the distribution, and was moved

  to the mirrored solvers/ path.

