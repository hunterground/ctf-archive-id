description: "Original statement, as recorded by a participating team's write-up:\n\n  biarkan dia memasak\n\n  nc 103.145.226.206 1965\n  Mirror: nc 103.145.226.209 1965\n\n  Author: kisanakkkkk\n\nThe distribution is a small Python chat stack: client.py and server.py agree a\nkey with Diffie-Hellman and then exchange AES-protected messages, while\nattacker.py is the relay the shipped service already runs in the middle. The\nplayer tampers with the relayed parameters and public keys to become the shared\nsecret holder and ask the server for the flag.\n"
