notes: 'Qualification challenge worth 500 points, rated Easy by its author. The public

  copy is a participant''s pen-testing write-up set: README.md, WRITEUP.md,

  SOLUTION.md, ATTACK_FLOW.txt, FILES_SUMMARY.md, exploit.py and

  payload_generator.py are the participant''s own documents, so only the

  penjarav2/ application tree was copied. bukan_flag.txt is preserved as found

  even though its name suggests a decoy. xjirada is named as the author both in that README and in

  the k1nomi write-up index.


  The participant''s own solver material (README.md, WRITEUP.md, SOLUTION.md, ATTACK_FLOW.txt,

  FILES_SUMMARY.md, exploit.py and payload_generator.py) was not part of the distribution and

  was not copied into original/.


  The Cyber Security IPB community archive corroborates this challenge: it publishes the same organizer
  statement, fixes the point value at 200 and names the author as xjirada. It ships no attachment for
  this challenge, so original/ is unchanged.

  '
