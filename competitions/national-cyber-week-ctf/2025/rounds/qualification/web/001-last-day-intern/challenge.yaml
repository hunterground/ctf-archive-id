description: "The distribution carries its own statement in the author's README:\n\n  I really hate my\
  \ internship. They didn't pay me well and made me work under\n  pressure, so I slipped a hidden feature\
  \ into their system. Hopefully someone\n  takes advantage of it, hahaha.\n\n  Category: Web Exploitation\
  \ | Difficulty: Easy | Points: 500\n  Author: xjirada\n\n  Objective: Find and exploit the \"hidden\
  \ feature\" left by the disgruntled\n  intern to capture the flag.\n\nThe distribution is penjarav2/,\
  \ the vulnerable Flask application with its\nDockerfile, docker-compose.yml, templates and static assets.\
  \ Its fetch endpoint\ntakes a user-supplied URL and can be steered at internal paths.\n\n  The Cyber\
  \ Security IPB community archive republishes the organizer's statement verbatim, which fixes the point\
  \ value and the author:\n\n  I really hate my internship. They didn’t pay me well and made me work under\
  \ pressure, so I slipped a hidden feature into their system. Hopefully someone takes advantage of it,\
  \ hahaha.\n\n  author: xjirada\n\n\n  http://31.97.187.222:9989/\n\n  Category: Web Exploitation | Points:\
  \ 200 | Author: xjirada\n"
