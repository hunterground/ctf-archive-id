notes: >
  Eighteen challenges are archived for this round across seven categories: Binary
  Exploitation 3, Blockchain 3, Cryptography 3, Forensic 3, Mobile Exploitation 1, Reverse
  Engineering 2 and Web Exploitation 3. The set is complete against the Cyber Security IPB
  archive, whose NCWBinusCTF/2025 directory numbers its eighteen challenge folders 001
  through 018 without a gap, and every one of those folders is represented here.

  Two sources were used. The Cyber Security IPB community archive supplies the organizer's
  statement verbatim for all eighteen, together with the point value and the named author,
  and the distributed attachments for fifteen of them. The SandWithCheese participant
  write-up tree supplies the larger derived forensics artefacts (the Locker and Malware
  Magang evidence sets and the tehc triage output) that the IPB source does not carry.
  Where both sources cover a challenge they were reconciled into a single record rather
  than imported twice; the IPB copy was preferred for metadata because it carries the
  statement, and only tehc.jpg was added from it.

  Three challenges publish a statement but no attachment in either source: Locker and
  Malware Magang name an external Google Drive or SharePoint link, and tehc ships only the
  teaser image while the AD1 image is an external link. Those external targets were not
  fetched and the omissions are recorded per challenge.
