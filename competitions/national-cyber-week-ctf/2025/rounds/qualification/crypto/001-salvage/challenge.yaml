notes: 'Qualification challenge worth 100 points. The statement, original category label, point value,
  named author and attachment set all come from the Cyber Security IPB community archive, which republishes
  the organizer''s brief verbatim in a title.txt/description.txt/files layout rather than the author''s
  original tree. The archive records Cryptography under the canonical crypto directory but keeps the upstream
  label in original_category. Attachment bundles stay zipped exactly as published, so their internal bytes
  match the source even where they contain macOS resource forks. chall.py builds a curve over the reals
  with mpmath at 1000 digits and encrypts the flag with AES-CBC under a key interpreted as the scalar
  multiple, so the task is to recover the scalar from the published point. The files are shipped unpacked
  rather than zipped.

  '
