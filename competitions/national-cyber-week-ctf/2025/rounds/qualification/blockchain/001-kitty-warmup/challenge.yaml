description: "The participant tree this record was first built from preserves no verbatim statement; the\
  \ organizer's statement was later recovered from the Cyber Security IPB archive and is quoted at the\
  \ end of this field. The distribution is a three-file\nSolidity set: Setup.sol deploys a Token with\
  \ 1e30 supply and a KittyWarmup\ncontract funded with 1e27 tokens, then seeds the player with 100 points\
  \ and\ndeclares the challenge solved once the player holds at least twice the target\npoints' worth\
  \ of tokens. Token.sol and KittyWarmup.sol carry the accounting.\n\nSetup.sol is annotated SPDX-License-Identifier:\
  \ UNLICENSED, which is preserved\nas found and is not an archive redistribution statement.\n\n  The\
  \ Cyber Security IPB community archive republishes the organizer's statement verbatim, which fixes the\
  \ point value and the author:\n\n  an easy introductional warm up to chess and checkers\n\n  author:\
  \ eyes\n\n\n  http://31.97.187.222:48212/\n\n  Category: Blockchain | Points: 100 | Author: eyes\n"
