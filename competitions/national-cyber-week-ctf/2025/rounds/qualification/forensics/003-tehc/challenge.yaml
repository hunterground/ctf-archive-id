notes: 'Qualification challenge. The directory name as published contains a non-ASCII

  emoji, so the archive directory uses the ASCII slug 003-tehc; provenance

  retains the original path. flag.py is the participant''s solver and was not

  copied. The AD1 image the shortcuts point at is not present in the source tree;

  only the derived artefacts and answers that were actually published are here.

  No solver scripts were present in the source.


  The Cyber Security IPB community archive corroborates this challenge: it publishes the same organizer
  statement, fixes the point value at 472 and names the author as f1ndm3. It also ships tehc.jpg, which
  was added to original/.

