notes: 'Qualification challenge. The participant tree also holds flag.py, a

  pwntools script that replays the fifteen answers to the validator, which was

  moved to solvers/; flag.txt is preserved as found. The question list itself is

  not preserved in this archive.

  Solver scripts found alongside the distribution were moved to the mirrored

  path under solvers/ per archive policy; that move is not recorded as a

  preservation omission.


  The Cyber Security IPB community archive corroborates this challenge: it publishes the same organizer
  statement, fixes the point value at 100 and names the author as Arenaru. It ships no attachment for
  this challenge, so original/ is unchanged.

