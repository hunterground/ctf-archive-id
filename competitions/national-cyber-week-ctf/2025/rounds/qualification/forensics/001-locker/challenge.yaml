description: "The participant tree this record was first built from preserves no verbatim statement; the\
  \ organizer's statement was later recovered from the Cyber Security IPB archive and is quoted at the\
  \ end of this field. The distribution is a Windows\nransomware incident set: several PE32+ executables\
  \ (laptopBaru.exe, sher.exe,\ntes.exe, chuongdoung.exe and \"Project Program array pdg.exe\") and an\
  \ exported/\ndirectory holding the victim's decoy documents, images, archives and the\nransom note that\
  \ labels the operation \"Arrenaru Locker\" with a victim ID,\ndirectory, timestamp and contact channels.\n\
  \nThe challenge is a question-and-answer investigation: the participant had to\nanswer fifteen questions\
  \ about the incident, in order, against a remote answer\nvalidator (nc). The answers are not recorded\
  \ here.\n\n  The Cyber Security IPB community archive republishes the organizer's statement verbatim,\
  \ which fixes the point value and the author:\n\n  Brian made a fatal mistake yesterday. He clicked\
  \ on something he shouldn't have.\n  Now, the fate of his data rests in your hands. Analyze the captured\
  \ pcap and binary files,\n  then answer the questions to retrieve the Flag.\n\n  https://drive.google.com/drive/folders/1N3A2ApuPpaEW7iD6HqUFJ2kSFbXhyQW4?usp=sharing\n\
  \n  pass: c3Vrc2VzIGRhbiBzZWxhbWF0IGJlcmp1YW5n\n\n  Author: Arenaru\n\n  Category: Forensic | Points:\
  \ 100 | Author: Arenaru\n"
