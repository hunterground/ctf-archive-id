  upstream label in original_category. Attachment bundles stay zipped exactly as published, so their internal
  bytes match the source even where they contain macOS resource forks. d8 is a purpose-built C++ harness
  (d8.cpp) that installs a seccomp filter before running the payload; it is not the V8 shell of the same
  name. The bundle also ships ynetd and a docker-compose.yaml.

