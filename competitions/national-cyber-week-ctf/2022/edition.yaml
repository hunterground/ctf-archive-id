notes: >
  Organizer recap: qualification online on 5 November 2022 with 42 teams from various
  universities, final onsite at BINUS Anggrek Kemanggisan on 12 November 2022 with the
  15 qualifying teams. The edition's official platform site was ncw2k22.com as recorded by
  the 2022 qualification challenge dump; that host is no longer archived and its status
  was not verified. No organizer or author challenge repository was found. Seven
  qualification challenges are archived from a participant-collected dump of the 2022
  platform. The remaining dumps and write-ups are registered in
  archives/repositories.yaml for maintainer review and were not imported.
