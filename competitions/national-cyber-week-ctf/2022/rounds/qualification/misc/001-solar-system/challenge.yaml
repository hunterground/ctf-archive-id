description: |
  Original statement (from the 2022 qualification challenge dump):
  
    In 2202 Human race finally fullfil their dream to live in space. But there
    are 3 things that stand out, namely, ISS (International Space Station), Bank
    of Flagzonia and a Space Artifact. and and um, by the way, have you visited
    all planets in the Milky Way?
  
    Hints: Static Analysis will only get you that far, why not try to deploy it
    and run it? / some function require tooooooo much gas fee to deploy and
    execute, there must be a way to decrease it right? right?
  
  The distribution is SOLAR_SYSTEM.zip, a Solidity contract (SOLAR.sol) with an
  accompanying Space_Artifacts.json state file and a Reminder.txt.
