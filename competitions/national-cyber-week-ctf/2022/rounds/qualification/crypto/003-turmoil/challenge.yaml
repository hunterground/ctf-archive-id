description: |
  Original statement (from the 2022 qualification challenge dump):
  
    Jamet and Mamang were assigned to build an RSA encryption machine to
    encrypt their boss's messages. But Jamet forgot to delete the code from the
    debugging process so some of it values are leaked. Is it really that
    dangerous?
  
    Author: kisanak#5303
    Chall: nc 103.167.136.75 9966
    Backup: nc 103.167.136.123 9966
  
  The distribution is soal.py, the RSA machine, whose debugging branch prints
  intermediate values alongside the ciphertext.
