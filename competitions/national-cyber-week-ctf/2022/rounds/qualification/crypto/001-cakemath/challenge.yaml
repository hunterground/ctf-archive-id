description: |
  Original statement (from the 2022 qualification challenge dump):
  
    Rehan, Jamet's acquintance, has just started learning cryptography and he
    chose this encryption from soneone's theory that he thought the
    implementation is pretty secure. What are the probability that someone had
    to break this encryption tho?
  
    Rehan said this is a warmups ~
  
    If you could break it, wrap the secret with `NCW22{.*}`
  
    Author: aseng#2055
  
  The distribution is dessert.py, an offline RSA-style encoder, plus output.txt
  with its captured output. Each bit of the flag is multiplied into a
  random-square product modulo c_n1, so the encoding leaks the bit pattern.
