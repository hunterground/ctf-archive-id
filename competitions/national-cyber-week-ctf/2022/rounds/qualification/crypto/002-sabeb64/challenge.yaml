description: |
  Original statement (from the 2022 qualification challenge dump):
  
    Jamet and Mamang are 2 scientists who want to study everything about
    cryptography. They intended to make a cryptographic tool, but there is
    something strange about the encoder they have made. The problem is, the
    encoder has already been used before the decoder was even designed. plus,
    Jamet accidentally spilled coffee on the source code, so now we can't see
    the encoding function. Can you solve it for them?
  
    tips: analyze the output and compare with the og ;)
  
    Chall: nc 103.167.136.75 9988
    Backup: nc 103.167.136.123 9988
  
    Author: kisanak#5303
  
  The distribution is sabeb.py with the encoding function body replaced by a
  coffee-spill comment block, plus a netcat service that prints encoded output.
