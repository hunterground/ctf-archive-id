description: |
  Original statement (from the 2022 qualification challenge dump):
  
    Mikael is still struggling to find his way so the author makes an easier
    way. Help him to get the value! Example if the value is 100 then write in the
    answer NCW22{100}.
  
    Author: Lawson Schwantz #3021
  
  The distribution is countheflagbuteasier.txt, a listing of an x86-64 `fungsi`
  routine that folds several constants through imul, lea, sal and sub; the answer
  is the value the routine computes.
