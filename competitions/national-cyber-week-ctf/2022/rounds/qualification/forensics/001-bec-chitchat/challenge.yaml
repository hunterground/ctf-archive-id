description: |
  Original statement (from the 2022 qualification challenge dump):
  
    "A few days ago, I went to a store wanting to buy groceries, but the store
    was closed. Then, in front of the store I saw a banner with an email
    referring to the owner of the store. I contacted the email several times and
    I received a reply message from the email along with a brochure. Long story
    short, I go back home and opened the brochure from my computer and my
    computer got hacked, and I only realized after a few days later."
  
    As a Forensic Expert, you are given a document to analyze these evidences:
  
    1. What's the name of suspected person(attacker) that send the malicious
       brochure? (FULLNAME all lower case)
    2. What is the attacker's phone number? [Format = +62..........]
    3. What is the Address(FQDN) that is close to the source email(sender)?
    4. What is the Address(IPv6 Address) that is close to the destination
       email(receiver)?
  
    The flag is all the answers concatenated with underscore:
    NCW22{answer1_answer2_answer3_answer4}
  
    Validation service: nc 103.167.136.75 1111 / nc 103.167.136.123 1111
  
  The distribution is Evidence.zip, which contains a single Outlook OST mailbox
  image (Evidence 51.ost).
