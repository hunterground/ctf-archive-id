description: |
  The source preserves no verbatim statement; the participant tree holds only the
  released binary. chall_70 is a 64-bit Linux PIE executable, not stripped and
  built with debug information, compiled from a CHICKEN Scheme source (test.scm)
  against libchicken.so.11.

  The embedded symbols retain the Scheme procedure names and source line
  references, including an nth helper and an "Out-of-bound (OOB) bug ?!!" message,
  which point at the input handling the challenge is built around.
