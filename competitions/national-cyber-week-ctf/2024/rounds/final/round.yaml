notes: >
  Date, venue and time window are from the organizer recap. Podium: SNI cabang siburian
  (1), time heals (2), nyan setsuna nyan (3). Eight challenges are archived in this round
  from the PETIR CTF Archive (PETIRsec/ctf-archive), which is the primary source: A4s
  lagi 4x and GCDeez (crypto); cloudsec2 and winsandbox (forensics); 19s and Evil Bitsy
  Problem (rev); and Pentester Toolbox and Spicy Storage (web). The two winsandbox and
  cloudsec2 challenges are remote forensic services whose distributed evidence is
  supplied on connection, so only the distribution scaffolding is archived.
  challenge_count counts the archived challenges, not the number played.
