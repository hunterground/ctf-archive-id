description: |
  The source preserves no verbatim statement. The distribution is dist/, a Flask
  song-database application (app.py, app2.py, Jinja templates, a Dockerfile,
  docker-compose.yml, start.sh and requirements.txt) backed by
  database/song_data.xml.
  
  The application parses the XML song database with lxml and serves lookups by
  song id through a page titled "Song Database", which is the surface the
  challenge is built around.
