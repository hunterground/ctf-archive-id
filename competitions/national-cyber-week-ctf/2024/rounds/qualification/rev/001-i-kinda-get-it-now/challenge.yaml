description: |
  The source preserves no verbatim statement. The distribution is
  `i_kinda_get_it_now`, a stripped 64-bit x86-64 ELF, plus output.txt with the
  program's printed output.
  
  The binary applies a chain of reversible byte transforms (substitution,
  rotation and modular inverse steps) to a buffer and compares it with a constant
  table, so inverting and reordering those steps recovers the input.
