description: >
  ShopiToko is an e-commerce platform that has experienced suspicious web-server
  activity. The logs show an attacker, "Bargain Hunter," fingerprinting the Java
  applicationchers, then probing endpoints and eventually uploading a suspicious file to
  reach sensitive customer information. The distribution is server.log. The organizer
  description is kept verbatim.
