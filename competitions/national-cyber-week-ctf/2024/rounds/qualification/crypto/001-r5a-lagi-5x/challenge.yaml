description: |
  The source preserves no verbatim statement. The distribution is R5Alagi5x.py,
  which builds a 1024-bit prime, folds five successive primes into it with
  repeated shift and increment steps, and encrypts
  w**5 + x**4 + y**3 + z**2 + flag under e = 65537. output.txt carries e, n and c.
  
  The modulus is deliberately structured so that the five prime factors can be
  recovered, after which the additive w**5 + x**4 + y**3 + z**2 term has to be
  stripped before the flag can be read. The script ships the placeholder
  FLAG = b'NCW24{fake_flag}'.
