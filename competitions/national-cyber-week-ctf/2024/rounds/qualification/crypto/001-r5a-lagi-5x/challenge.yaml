description: |
  The organizer description, kept verbatim, is a play on the R5A name: the encryption
  "has the number 5 in it," with a note hoping there is no misconfiguration this time
  after IFEST. The distribution is R5Alagi5x.py and output.txt, which build a modulus
  from folded primes and require recovering the factors before the flag can be read.
