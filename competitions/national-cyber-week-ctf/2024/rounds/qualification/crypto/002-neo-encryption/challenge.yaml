description: |
  The source preserves no verbatim statement. The distribution is a Sage script
  that takes the flag as an integer m, picks two 512-bit primes p and q, and
  publishes the third power of the 2x2 matrix [[m, p], [q, m+3]] together with
  e = 3 and n = p*q. output.txt carries C, e and n.
  
  Because the matrix entries leak p and q through the two off-diagonal terms, the
  modulus factors directly; taking an integer cube root of the matching diagonal
  entry then recovers m.
