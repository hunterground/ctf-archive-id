notes: >
  The archived official site gives the competition platform host as the CTF entry point
  and describes the CTF as an online qualification followed by an offline final, teams of
  up to three. The organizer recap is the source for the dates and counts. Nineteen
  challenges are archived in this round from the PETIR CTF Archive (PETIRsec/ctf-archive),
  which is the primary source: gandalf, KaZooYa, veight (pwn); R5A lagi 5x, Neo Encryption,
  Tak Ada Rotan (crypto); Multiplex, ShopiToko, ZaBlender (forensics); Surat Cinta Untuk
  CSC, Blackbox Blockchain, Diddy's Party, Shadow Hunt (misc); I Kinda Get It Now, SDP,
  Sideload (rev); and bengsky's submission, Old But Gold Maybe, This is Cursor Era No
  VSCode (web). Multiplex's evidence is an external MEGA attachment that is not copied into
  the archive. Six solver scripts were moved to the mirrored solvers/ paths.
