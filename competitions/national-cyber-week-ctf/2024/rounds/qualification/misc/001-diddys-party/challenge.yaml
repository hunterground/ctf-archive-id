description: |-
  A Solidity smart-contract challenge. The author's repository describes it as the
  NCW 2024 Misc hard challenge (Blockchain).

  The distribution is a Foundry-style pair of contracts: Setup deploys Locket with
  30 ether, and Locket sells a 5-ether normal ticket whose refund is gated on an OTP
  derived from block.timestamp and msg.sender, plus a 30-ether party ticket that sets
  isSolved. The refund transfers the ether before clearing the ticket flag, so the
  contract can be drained through reentrancy.
