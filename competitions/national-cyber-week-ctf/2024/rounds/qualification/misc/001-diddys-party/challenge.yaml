notes: |
  Author-published source. The repository metadata says "CTF NCW 2024 - Misc Hard
  Challange (Blockchain)" and its single commit is dated 2024-10-02, four days before
  the 6 October 2024 online qualification, which places it in the qualification round.
  The author's portfolio independently names Diddy's Party as a "Hard-rated smart
  contract exploitation challenge authored for National Cyber Week 2024", which is the
  basis for difficulty.value. No public scoreboard entry for this challenge was located,
  so the round attribution rests on the source description and the commit date rather
  than on an organizer challenge list.

  The repository file layout is flat at its root (Setup.sol, Locket.sol, Attack.sol), so
  the challenge is the repository root and provenance.original_path is null; the two
  distribution files were copied into original/ unchanged. Setup.sol and Attack.sol
  import "chall/Locket.sol" while Locket.sol sits at the repository root; that path
  mismatch is preserved as found and was not repaired. Attack.sol is the author's
  exploit and was moved to the mirrored path under solvers/ per archive policy; that move
  is not recorded as a preservation omission. The contracts carry no flag value.

