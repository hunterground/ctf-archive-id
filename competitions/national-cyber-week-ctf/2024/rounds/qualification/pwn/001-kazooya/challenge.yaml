description: |
  The source preserves no verbatim statement. The distribution is the compiled
  `chall` service binary together with the Dockerfile that wrapped it in xinetd
  for remote play.
  
  The Dockerfile is shipped as found but is incomplete: it copies chall.cpp,
  Makefile, run.sh, xinetd.conf, startchall.sh and flag.txt, none of which are
  present in the source tree. Only the built binary is actually available, so the
  challenge has to be solved against the binary rather than rebuilt.
