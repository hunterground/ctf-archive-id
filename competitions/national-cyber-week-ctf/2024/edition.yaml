notes: >
  Organizer recap: a workshop "Guardian Of The Chain: Safeguarding Blockchain Security" by
  Nicholas Rianto Putra (Ottersec) on Saturday 5 October 2024, then an online qualification
  on Sunday 6 October 2024, 09:00-19:00 WIB, with 55 registered teams of three, and an
  offline final on 16 November 2024, 13:00-16:20 WIB, at BINUS Kampus Syahdan Ruang M2CD
  with 15 teams. participant_count is the qualification team figure. The archived official
  site gives ncw.cscbinus.com as the edition site and describes the same two-stage format.

  Ten challenges are archived: eight from the qualification and two from the final.
  Diddy's Party (misc) comes from the author's own repository. R5A lagi 5x and Neo
  Encryption (crypto), KaZooYa (pwn), Shadow Hunt (misc), I Kinda Get It Now (rev) and
  Old But Gold, Maybe (web) come from a participant write-up tree that preserved the
  distributed files, as do the two final challenges Pentester Toolbox (web) and 19s
  (rev). The remaining participant collections covering this edition are registered in
  archives/repositories.yaml for maintainer review and were not imported. Podium: SNI
  cabang siburian (1), time heals (2), nyan setsuna nyan (3).
