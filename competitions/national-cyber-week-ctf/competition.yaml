notes: >
  Editions & Schedule

  - 2022-2025: Each edition is corroborated by an organizer recap on the CSC BINUS website and followed 
    a qualification-to-final structure. The 2024 event site (ncw.cscbinus.com) is the only edition 
    preserved via the Wayback Machine.
  - 2026: Registration is live with a scheduled workshop on December 18, 2026, but no CTF dates are stated yet, 
    so no 2026 rounds are recorded.

  Challenge Archive & Scope

  - Imported vs. Pending Materials: Only a single author-published 2024 challenge (Diddy's Party) is currently archived. 
    All other located 2022-2025 materials are participant-side and logged in archives/repositories.yaml for maintainer 
    review rather than imported.
  - Scope Exclusion: The separate "CSC CTF Contest" organized by the community's research divisions is treated as a 
    distinct event and excluded from this record.
