notes: The organizer string is the penyelenggara named in the GEMASTIK XVII (2024) guidebook. The same
  parent body was not re-checked for every other edition. The guidebook places Gemastik XVI in 2023 and
  Gemastik XVII in 2024. A Universitas Gadjah Mada decree identifies GEMASTIK XVIII as the 2025 edition.
  The recorded formats are the 2024 qualification and final formats. Challenge material for the
  qualification round of 2023, 2024, and 2025 comes from the problem-setter repositories published under
  the ctf-gemastik GitHub organization, whose profile describes them as the place where Gemastik Capture
  the Flag challenges provided by the problem setters are stored.
