notes: >-
  The GEMASTIK XVIII guidebook schedules the Cyber Security qualification on 24 August 2025 with
  write-up judging 25-31 August 2025, and a non-scoring warm-up on 10 August 2025. No warm-up
  challenge files are published in the organizer repository, so no warmup round is created. The
  ten imported challenges are the complete set published under this repository's cry, for, pwn,
  rev, and web directories. This repository publishes bare directory names (cry, for) rather than
  the full category words, and states no difficulty or tags; those labels are preserved in
  original_category.
