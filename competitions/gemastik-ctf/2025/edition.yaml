notes: >-
  GEMASTIK XVIII was hosted by Telkom University in 2025. The GEMASTIK 2025 guidebook gives the
  Cyber Security qualification as an online round on 24 August 2025 with write-up judging 25-31
  August 2025, and the final competition on 28 October 2025 with write-up presentation on 29
  October 2025 and the closing ceremony on 30 October 2025. Edition start is the qualification
  date and edition end is the closing ceremony. Only the qualification challenge set is published
  by the organizer, so the ten imported challenges and the edition challenge_count are the
  qualification count; the final attack-defense challenges are not published and are not recorded
  here. The earlier reference recorded a Universitas Gadjah Mada decree naming its GEMASTIK XVIII
  contingent; it is retained because it independently dates the edition to 2025.
  Secondary sources reviewed but not imported: no participant writeup collection for the 2025
  qualification round was located.
