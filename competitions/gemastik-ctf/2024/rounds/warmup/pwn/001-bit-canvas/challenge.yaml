description: A menu-driven bit canvas service. The resize option sets the bitmap width without reallocating
  the 16-entry canvas array, so drawing past the original bounds corrupts adjacent stack memory. The service
  exposes a stack canary read through the debug output and a password check that compares the entered
  value against the flag file. Find the memory corruption that reaches the flag.
