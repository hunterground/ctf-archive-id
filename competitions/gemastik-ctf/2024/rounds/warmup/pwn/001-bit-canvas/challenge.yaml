notes: Warm-up service from the GEMASTIK XVII final. The setter README lists it under warmup-challenges
  with category pwn and author vidner. The source has no challenge description statement; the description
  here summarises the shipped main.c. original/flag.txt is not part of this distribution; the binary reads
  /flag.txt and the compose file mounts no flag, so no flag file is preserved. The forwarded container
  ports are 20000/20022; the archive does not record them as connection info because the tournament instances
  are gone.
