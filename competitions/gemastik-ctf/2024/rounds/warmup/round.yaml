notes: >-
  The UNNES pocket book for GEMASTIK XVII schedules a warm-up for Divisi 2 Keamanan Siber on Sunday,
  22 September 2024, inside the final-week programme of 22-26 September 2024. The setter repository
  publishes exactly four services as "warmup-challenges", and those four are the challenges archived in
  this round. No start time is recorded because the pocket book gives only a combined time block for the
  Sunday row. The 2024 Pedoman describes a different, earlier schedule (a 30 June 2024 online warm-up
  before the qualification); that warm-up has no published challenge files and is not this round. The
  Pedoman's final-week dates were superseded by the official Pengumuman Perubahan Jadwal 2024, which
  moved the final to 22-26 September 2024.
