description: 'A shellcode runner that executes submitted x86-64 machine code inside a Unicorn emulator.
  The emulator implements a small note API: create, edit, delete, view and a register dump. The note bookkeeping
  trusts the guest-supplied index, so guest code can drive the host helpers out of bounds.'
