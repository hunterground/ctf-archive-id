notes: Attack-defense final service from the GEMASTIK XVII final. The setter README labels it web-pwn
  with author circleous; the archive category is pwn because of the C overflow in fjb/kauth/kauth.c (strcpy
  of the token name into a 128-byte claim field), and original_category keeps the source label. Source
  review also shows a checkout that never transfers the catalog value, so competing teams also exploited
  the logic. The shipped fjb/fjb.db is an empty schema-only SQLite database and is preserved. fjb/src/secret.lua
  contains the fixed 32-byte HMAC key shipped with the distribution; it is original challenge material
  and is preserved unmodified, not a live credential.
