description: A marketplace with a React frontend, an Apache mod_lua backend and a C Lua module for session
  tokens. Cart, catalog and checkout endpoints are exposed, and the catalog carries a hidden per-item
  value that checkout ignores. The C module copies the claim name into a fixed-size buffer without a length
  check.
