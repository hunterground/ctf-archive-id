notes: >-
  The UNNES pocket book schedules the Divisi 2 Keamanan Siber competition on Monday, 23 September 2024
  from 13.00 to 18.00 WIB, with write-up drafting 19.00-04.00 and write-up presentations on 24 September
  2024. The Pedoman GEMASTIK 2024 states an earlier plan (competition 10 September 2024, presentations
  11 September 2024); that plan was superseded by the official Pengumuman Perubahan Jadwal 2024, which
  moved the final week to 22-26 September 2024, and the BPTI news post confirms the event ran 22-26
  September 2024. The round date recorded here follows the pocket book and the schedule-change
  announcement. The eight services under "final-challenges" in the setter repository are the challenges
  archived in this round. The 2024 Pedoman describes the final as attack-defense; the archived services
  are the attack-defense service environments.
