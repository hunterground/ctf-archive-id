notes: Attack-defense final service from the GEMASTIK XVII final. The setter README lists it under final-challenges
  with category web and author dummklloun. The repository root has no Dockerfile for this service; its
  compose file builds ./backend and ./frontend, and both are preserved. Source review confirms ReportHandler.get
  replaces <REPORT_NAME> in report_template.html and renders it with tornado.template.Template, while
  nginx only proxies ^/api/public. The participant write-up linked from the setter README is recorded
  as a reference only.
