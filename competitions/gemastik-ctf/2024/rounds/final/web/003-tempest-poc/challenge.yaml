description: 'A vulnerability scanner proof of concept: an nginx frontend proxies only /api/public to
  a Tornado backend, which also serves /api/private/report. The report endpoint substitutes a request
  parameter into an HTML template before rendering it. Reach the blocked private endpoint through the
  public surface.'
