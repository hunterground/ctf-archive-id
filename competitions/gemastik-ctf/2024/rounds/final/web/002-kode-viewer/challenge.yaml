description: A paste service for code snippets, with a NestJS backend on Redis. Each paste is stored under
  a key assembled from the owner email, name, language and visibility. Sessions and pastes share the key
  space, and the search endpoint interpolates the pattern into a Redis key glob, so one object can be
  reached as another.
