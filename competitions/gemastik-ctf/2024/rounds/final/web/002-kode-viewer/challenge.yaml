notes: Attack-defense final service from the GEMASTIK XVII final. The setter README lists it under final-challenges
  with category web and author vidner. Source review shows kode.service.ts building keys as kode-<email>-<name>-<lang>-<kind>
  and find() passing the user pattern into a *_<pattern>*-public Redis query. The repository README at
  kode-viewer/README.md is the unmodified Nest starter boilerplate and is preserved. The compose file
  mounts ./redis-data, which does not exist in the distribution.
