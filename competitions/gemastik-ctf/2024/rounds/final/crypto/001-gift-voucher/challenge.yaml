description: A voucher shop using a per-connection 1024-bit RSA key. Vouchers are raw PKCS#1 v1.5 style
  signatures over a message built from a fixed prefix, random padding and a SHA-256 digest of the account
  name, and the shop will sign a limited number of them. Exploit the scheme and the private key exposure
  to mint vouchers worth enough to buy the flag.
