notes: Attack-defense final service from the GEMASTIK XVII final. The setter README labels it web-crypto
  with author vidner; the archive category is crypto because the intended break is the AES-ECB token scheme,
  and original_category keeps the source label. Source review confirms src/crypto_ffi.erl calls aes_128_ecb
  and src/app/config.gleam falls back to the constant change-me-please when .aes-key is absent. The source
  has no challenge description statement; the description here summarises the shipped Gleam source.
