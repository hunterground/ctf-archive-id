description: Setelah bertahun tahun menjadi orang normal, akhirnya kamu berkesempatan untuk menjadi raja
  Karbit. Tapi, untuk menjadi raja Karbit, kamu harus menyelesaikan tantangan yang diberikan oleh raja
  Karbit sebelumnya. Kamu harus bisa membuktikan bahwa kamu bisa mencuri data rahasia dari raja Karbit
  sebelumnya. Curi data tersebut dan buktikan bahwa kamu layak menjadi raja Karbit.
