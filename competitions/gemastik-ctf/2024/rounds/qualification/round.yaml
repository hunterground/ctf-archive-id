notes: >-
  The GEMASTIK XVII guidebook schedules the Cyber Security qualification as a Capture the Flag
  round on 12-13 July 2024, with write-up judging 14-22 July 2024. It also schedules a
  non-scoring warm-up on 30 June 2024; no warm-up challenge files are published in the organizer
  repository, so no warmup round is created. The fifteen imported challenges are the complete set
  published under this repository's crypto, forensics, pwn, rev, and web directories; the
  template directory is repository tooling and is not imported.
