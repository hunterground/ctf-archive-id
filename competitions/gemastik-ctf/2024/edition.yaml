notes: >-
  Qualification Capture the Flag on 12-13 July 2024, with a non-scoring online warm-up on 30 June 2024.
  The final week ran 22-26 September 2024 at Universitas Negeri Semarang: the Cyber Security division
  held a warm-up on 22 September, the attack-defense competition on 23 September (13.00-18.00 WIB), and
  write-up presentations on 24 September 2024. The Pedoman GEMASTIK 2024 lists an earlier plan with the
  final on 10-11 September 2024; that plan was superseded by the official Pengumuman Perubahan Jadwal
  2024, and the BPTI news post confirms the 22-26 September dates. The edition dates here run from the
  qualification start to the last Cyber Security activity (the write-up presentations).
  Challenge material comes from two sources. The fifteen qualification challenges are the complete set
  published by the organizer in ctf-gemastik/penyisihan-2024. The four warm-up and eight final challenges
  are the Docker service environments published by the problem setters in vidner/gemastik-xvii-final.
  The edition challenge_count of 27 is the sum of those imported sets. The 30 June online warm-up had no
  published challenge files and is not a round in this archive. Secondary sources reviewed but not
  imported: nopedawn/CTF (GEMASTIK-XVII-2024, qualification and final writeup PDFs),
  hackaforgesec/ctf-writeup (Gemastik-2024/quals, per-challenge writeups such as
  Forensics/Baby_Structured), and Hope0351/my_CTF_collections (Final Gemastik 2024, final-round web
  writeup). All three are participant writeup collections and were not used as the import source.
