notes: >-
  GEMASTIK XVI was held in 2023. The GEMASTIK 2023 guidebook gives the Cyber Security qualification as
  a Capture the Flag round on 16 July 2023 and the final as 12-16 September 2023, with the competition
  itself on 14 September 2023. Edition start is the qualification date and edition end is the close of
  the final and award ceremony on 16 September 2023. Challenge material now comes from two sources. The
  thirteen qualification challenges are the complete set published by the organizer in
  ctf-gemastik/penyisihan. The three warm-up and seven final challenges are the Docker service
  environments published by the problem setters in vidner/gemastik-xvi-final, imported later than the
  qualification set; the edition challenge_count is the sum of both, 23. A UMS news article reports
  roughly 250 teams in the qualification and the final hosted at Universitas Brawijaya, but that figure
  is a participant account rather than an official statistic, so participant_count stays null. Prior to
  the qualification import the edition carried no references and no extracted competition dates; those
  were established from the guidebook. The guidebook also schedules, within the same final week, a
  Cyber Security warming-up on 13 September 2023 (13.00-16.00 WIB), the attack-defense competition on
  14 September 2023 (08.30-17.30 WIB), and a write-up presentation on 15 September 2023; those stage
  dates are recorded on the round records. Secondary sources reviewed but not imported:
  devit7/CTF-Writeup-Mpiie (gemastik2023 directory, forensic writeups hosted on Google Drive) and
  nopedawn/CTF. Neither matches the organizer qualification challenge set imported here - devit7 names
  forensic challenges HELLO WORD, GEN Z, SCATTRED, TOM THE CAT, and THE SECRET, which are absent from
  the organizer repository, so its scope is unclear and needs review. nopedawn/CTF only covers GEMASTIK
  XVII 2024.
