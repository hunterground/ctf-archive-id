notes: >-
  The GEMASTIK 2023 guidebook states that the Cyber Security final has two stages, an attack-defense
  competition and a presentation, and dates the attack-defense stage to 14 September 2023 from 08.30
  to 17.30 WIB, with the write-up presentation on 15 September 2023. The setter repository publishes
  seven of the ten services with stage "final", and those seven are the challenges archived in this
  round. The guidebook describes the format as teams patching a system with a planted vulnerability and
  then capturing opponents' flags while defending their own. The setter write-up records the number of
  teams that solved each service out of 20 finalists; that figure is recorded in the individual
  challenge notes and not as a participant count, because it counts solving teams rather than entrants.
