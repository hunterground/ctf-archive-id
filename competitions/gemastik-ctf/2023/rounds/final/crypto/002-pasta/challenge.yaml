notes: Attack-defense final service from the GEMASTIK XVI final. The setter README lists it with author
  merricx and stage final; the repository gives no challenge category, so the archive category is a best-fit
  classification. The setter write-up describes the per-version curve and hash pairing and the roughly
  9-bit nonce bias on the P-521 and SHA-512 version, requiring about 100 to 110 signatures; it links EPRINT
  2019/023 for the hidden number problem. The write-up states it was solved by 0 of 20 teams. original/.passwd
  is a short ASCII string shipped with the distribution; the service generates its database users at image
  build time from the PASSWORD build argument, so it is not a live credential. original/flag.txt contains
  PLACEHOLDER. The service is deployed by the repository's shared services/docker-compose.yml, which is
  copied verbatim into original/ together with the service directory. That shared file also defines the
  other nine services, warm-up and final; the section for this service gives its ports, SSH password argument,
  flag mount from receiver/flags/, and the utils/bashrc and utils/preexec.sh mounts. Those shared files
  are repository tooling and are not copied, so the paths in this compose file that point at ../receiver
  or ../utils do not resolve inside original/.
