description: A register-and-login service that issues a PASETO-inspired token. Tokens are signed with
  ECDSA using a deterministic nonce derived from HMAC over the private key and the message. Four token
  versions pair different curves with different hash functions; the P-521 and SHA-512 combination truncates
  the nonce and introduces a bias. Forge a token whose role is admin to reach the flag endpoint.
