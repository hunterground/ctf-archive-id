notes: Attack-defense final service from the GEMASTIK XVI final. The setter README lists it with author
  deomkicer and stage final; the repository gives no challenge category, so the archive category is a
  best-fit classification. The setter write-up records the nonce construction t * 2^u + v and notes that
  two signatures suffice to eliminate the unknowns; it also records that the service hashed with CRC32,
  which the write-up describes as poor practice. The write-up states it was solved by 1 of 20 teams. The
  shipped priv.data is 154 bytes of the placeholder string, and original/flag.txt contains PLACEHOLDER.
  The service directory ships its own docker-compose.yml, which is preserved unchanged.
