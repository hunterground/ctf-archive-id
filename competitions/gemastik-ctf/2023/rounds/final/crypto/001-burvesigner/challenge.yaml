description: A guest login service that issues an ECDSA signature over the session as a token, using the
  secp112r1 curve. The nonce is derived from the current time as (t * 1337 << u) + v with a small random
  v, so it is far from unpredictable. Recover the signing key and forge a token carrying the admin role.
