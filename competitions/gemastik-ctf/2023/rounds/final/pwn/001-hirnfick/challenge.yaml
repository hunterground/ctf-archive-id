description: A web service that runs user-supplied Brainfuck code. The interpreter is a C program with
  a 1024-byte data array and a 1024-byte code array and no bounds check on the data pointer, so a Brainfuck
  program can read and write outside the array. Participants received only the compiled binary, not its
  source.
