notes: Attack-defense final service from the GEMASTIK XVI final. The setter README lists it with author
  circleous and stage final; the repository gives no challenge category, so the archive category is a
  best-fit classification. The setter write-up describes a debug flag adjacent to the data array and a
  global offset table overwrite that turns puts into system; it records that participants received no
  source but the compiled binary, and that the SLA check ran Brainfuck input and output cases from Wikipedia
  and copy.sh. The write-up states it was solved by 4 of 20 teams. The compiled original/src/hirnfick
  binary and its hirnfick.c source are both shipped in the repository. The service directory ships its
  own docker-compose.yml, which is preserved unchanged.
