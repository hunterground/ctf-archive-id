notes: Attack-defense final service from the GEMASTIK XVI final. The setter README lists it with author
  dummklloun and stage final; the repository gives no challenge category, so the archive category is a
  best-fit classification. The setter write-up explains that the Go service's jsonparser takes the first
  duplicate key while the Python jsonschema validation takes the last, and that the differential bypasses
  validation to reach a blind SQL injection on /notes/count. It records that defense was only possible
  over SSH. The write-up states it was solved by 0 of 20 teams. The distribution includes release/gemas-notes.zip
  and a note-service backend.log, both preserved verbatim. The service is deployed by the repository's
  shared services/docker-compose.yml, which is copied verbatim into original/ together with the service
  directory. That shared file also defines the other nine services, warm-up and final; the section for
  this service gives its ports, SSH password argument, flag mount from receiver/flags/, and the utils/bashrc
  and utils/preexec.sh mounts. Those shared files are repository tooling and are not copied, so the paths
  in this compose file that point at ../receiver or ../utils do not resolve inside original/.
