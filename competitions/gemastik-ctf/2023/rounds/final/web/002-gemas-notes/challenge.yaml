description: 'A notes service split into two microservices: a Python validation service that checks submitted
  JSON, and a Go notes service that performs the create, read, update and delete operations against MySQL.
  The two JSON parsers disagree about which value wins when a key is repeated, so a document can validate
  under one reading and execute under another.'
