notes: Attack-defense final service from the GEMASTIK XVI final. The setter README lists it with author
  vidner and stage final; the repository gives no challenge category, so the archive category is a best-fit
  classification from the shipped app.rb. The setter write-up quotes the concatenation in the get '/art/:word'
  route and recommends a Slim template parameter or string interpolation. The write-up states it was solved
  by 18 of 20 teams, the most-solved service. The service directory ships its own docker-compose.yml,
  which is preserved unchanged.
