references:
- title: gemastik-xvi-final - services/gemas-fetcher
  url: https://github.com/vidner/gemastik-xvi-final/tree/f31c2c42b42371cac4789ebb849a5a7ac76c4140/services/gemas-fetcher
  type: third_party_archive
  accessed: '2026-11-26'
verification: corroborated
notes: Attack-defense final service from the GEMASTIK XVI final. The setter README lists it with author
  ganezo and stage final; the repository gives no challenge category, so the archive category is a best-fit
  classification. The setter write-up attributes the bypass to CVE-2023-24329 and notes that only urllib.request
  followed a URL with leading whitespace, out of the three fetch methods. The write-up states it was solved
  by 9 of 20 teams. Nearly all of this service's 30 MB is a vendored frontend library tree under src/UI/assets/libs,
  which is part of the distribution and is preserved in full. The shared compose sets a MongoDB URI and
  root password as environment values; those strings ship with the repository and are preserved as original
  challenge material. The service is deployed by the repository's shared services/docker-compose.yml,
  which is copied verbatim into original/ together with the service directory. That shared file also defines
  the other nine services, warm-up and final; the section for this service gives its ports, SSH password
  argument, flag mount from receiver/flags/, and the utils/bashrc and utils/preexec.sh mounts. Those shared
  files are repository tooling and are not copied, so the paths in this compose file that point at ../receiver
  or ../utils do not resolve inside original/.
