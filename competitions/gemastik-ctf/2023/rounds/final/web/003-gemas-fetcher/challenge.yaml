description: A website that fetches a user-supplied URL server-side using curl, wget and the Python urllib.request
  module. Before fetching, the URL is validated and its scheme checked with urllib.parse.urlparse, rejecting
  the file and ftp schemes. A leading whitespace character makes urlparse report no scheme, so the check
  can be bypassed.
