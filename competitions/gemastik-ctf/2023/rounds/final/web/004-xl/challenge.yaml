notes: Attack-defense final service from the GEMASTIK XVI final. The setter README lists it with author
  vidner and stage final; the repository gives no challenge category, so the archive category is a best-fit
  classification. The setter write-up quotes the library's type=file branch and recommends defaulting
  the type to buffer or dropping the unused options parameter. The write-up states it was solved by 0
  of 20 teams. original/README.md is the unmodified Nest starter boilerplate and is preserved. The service
  directory ships its own docker-compose.yml, which is preserved unchanged.
