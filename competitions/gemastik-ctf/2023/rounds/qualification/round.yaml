notes: >-
  The GEMASTIK XVI guidebook schedules the Cyber Security qualification as a Capture the
  Flag round on 16 July 2023, 18.00-23.00 WIB, with write-up judging 17-30 July 2023. It also
  schedules a non-scoring warm-up on 9 July 2023; no warm-up challenge files are published in
  the organizer repository, so no warmup round is created. The thirteen imported challenges are
  the complete set published under this repository's crypto, forensics, pwn, rev, and web
  directories; the template directory is repository tooling and is not imported. The guidebook
  lists the tested material as system hardening, web, digital forensic, cryptography, binary
  analysis, steganography, reverse engineering, and network sniffing, which is consistent with
  the five published category directories.
