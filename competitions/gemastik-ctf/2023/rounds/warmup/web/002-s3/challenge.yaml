notes: Warm-up service from the GEMASTIK XVI attack-defense final. The setter README lists it with author
  deomkicer and stage warmup; the repository gives no challenge category, so the archive category is a
  best-fit classification from the shipped main.py. The setter exploit passes filename=/flag.txt to the
  download endpoint, which works because os.path.join discards the base when the second argument is absolute.
  The service directory ships its own docker-compose.yml, which is preserved unchanged.
