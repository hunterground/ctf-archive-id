description: A file upload and download service. Uploads reject filenames containing '..' or 'flag', and
  downloads reject '..' as well. The upload path is built with os.path.join against the literal uploads
  directory, while the download path passes the filename through the same join without preventing an absolute
  path from replacing the base directory.
