notes: >-
  The GEMASTIK 2023 guidebook schedules a warming-up (pemanasan pra-final) for Divisi II Keamanan
  Siber on 13 September 2023 from 13.00 to 16.00 WIB, during the final-week technical meeting. The
  setter repository publishes three of the ten services with stage "warmup", and those three are the
  challenges archived in this round. The guidebook gives no separate scoring rule for this stage; it
  describes the final as an attack-defense competition followed by a write-up presentation.
