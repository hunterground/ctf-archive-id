description: A small x86-64 service that reads a line into a 64-byte stack buffer with fgets and then
  prints a fixed message. The read length exceeds the buffer, so a long line overwrites the saved return
  address. The binary is a non-PIE executable with puts available, so the GOT can be leaked and libc reached.
