notes: Warm-up service from the GEMASTIK XVI attack-defense final. The setter README lists it with author
  dummklloun and stage warmup; the repository gives no challenge category, so the archive category is
  a best-fit classification from the shipped main.c. Back-to-basic was one of the three warm-up services.
  The setter exploit reads a libc offset from a leaked puts address and then jumps to system, which matches
  the source. The service is deployed by the repository's shared services/docker-compose.yml, which is
  copied verbatim into original/ together with the service directory. That shared file also defines the
  other nine services, warm-up and final; the section for this service gives its ports, SSH password argument,
  flag mount from receiver/flags/, and the utils/bashrc and utils/preexec.sh mounts. Those shared files
  are repository tooling and are not copied, so the paths in this compose file that point at ../receiver
  or ../utils do not resolve inside original/.
