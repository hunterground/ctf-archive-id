notes: Poltek SSN dates the 2025 final to 22-23 October. A competition calendar identifies that final
  as Wreck-IT 6.0 and gives qualification on 4 October 2025, with Umum and Junior categories. Only the
  junior qualification web category was imported, from an author-published repository at commit
  7bf3a7b9e47bca7931af81a8a7e13015b20d1b03. Four challenges are archived, all in the junior division.
  The repository does not state that its owner wrote the challenges, so no author is recorded, and a
  participant write-up is cited as the corroboration that these four titles belong to the junior
  qualification web set. No general-category source was found.
