<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost In Templation</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <header class="temple-header">
            <h1 class="temple-title">Lost In Templation</h1>
            <p class="temple-subtitle">Ancient Templates Await Your Discovery</p>
        </header>
        
        <div class="temple-content">
            <form class="temple-form" action="" method="post">
                <div class="ritual-text">
                    <span class="mystical-prompt">🔮 Enter the sacred words to unlock ancient wisdom...</span>
                </div>
                <div class="input-container">
                    <input class="temple-input" type="text" name="text" value="" placeholder="Type your message here...">
                    <input class="temple-button" type="submit" value="🗝️ Transmute">
                </div>
            </form>
            
            <div class="revelation-area">
                <h2 class="ancient-text">TEXT</h2>
            </div>
        </div>
        
        <footer class="temple-footer">
            <div class="mystical-symbols">⚡ ◇ ⚡ ◇ ⚡</div>
        </footer>
    </div>
</body>
</html>
