<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIAKAD Roblox</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
    <meta name="description" content="Sistem Informasi Akademik Universitas Roblox - The Most Based Academic System">
    <meta name="keywords" content="Roblox, SIAKAD, University, Epic Gamer, Education, Oof">
    <meta name="author" content="Chad Developers at Roblox University">
    <meta property="og:title" content="SIAKAD Roblox - Epic Gamer University">
    <meta property="og:description" content="The most based academic information system powered by oof energy">
    <meta property="og:type" content="website">
    
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.6s ease-out;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #1e3a8a 0%, #3730a3 50%, #581c87 100%);
        }
        
        .glass-effect {
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        
        /* Loading spinner */
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #fbbf24;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Toast notifications styling */
        .toast-enter {
            transform: translateX(100%);
            opacity: 0;
        }
        
        .toast-enter-active {
            transform: translateX(0);
            opacity: 1;
            transition: all 0.3s ease-in;
        }
    </style>
</head>
<body class="gradient-bg text-white min-h-screen">
    <div id="loading" class="fixed inset-0 gradient-bg flex items-center justify-center z-50">
        <div class="text-center fade-in">
            <div class="spinner mx-auto mb-6"></div>
            <div class="text-center">
                <h2 class="text-2xl font-bold text-yellow-400 mb-2">🎓 SIAKAD Roblox</h2>
                <p class="text-blue-200">WRECK IT 6.0 Challenge</p>
                <div class="text-sm text-blue-300 mt-4">Memuat sistem...</div>
            </div>
        </div>
    </div>

    <div id="app" class="hidden">
    </div>

    <div id="error-toast" class="hidden fixed top-4 right-4 bg-red-500 bg-opacity-90 backdrop-blur-sm text-white px-6 py-4 rounded-lg shadow-xl z-50 max-w-sm">
        <div class="flex items-center">
            <span class="text-xl mr-3">❌</span>
            <div>
                <div class="font-medium">Error</div>
                <div id="error-message" class="text-sm opacity-90"></div>
            </div>
        </div>
    </div>

    <div id="success-toast" class="hidden fixed top-4 right-4 bg-green-500 bg-opacity-90 backdrop-blur-sm text-white px-6 py-4 rounded-lg shadow-xl z-50 max-w-sm">
        <div class="flex items-center">
            <span class="text-xl mr-3">✅</span>
            <div>
                <div class="font-medium">Berhasil</div>
                <div id="success-message" class="text-sm opacity-90"></div>
            </div>
        </div>
    </div>

    <!-- Include JavaScript libraries -->
    <script src="lib/constants.js"></script>
    <script src="lib/util.js"></script>
    <script src="lib/jwt.js"></script>
    <script src="lib/auth.js"></script>
    <script src="app.js"></script>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
                document.getElementById('app').classList.add('fade-in');
            }, 1500);
        });
    </script>

</body>
</html>
