notes: >-
  Held offline on 20 May 2023 at Hotel Aston Kemayoran, Jakarta, with Bank Sinarmas Syariah as sponsor;
  APTIKNAS reports 274 teams from across Indonesia. The penyisihan was jeopardy and the final
  attack-defense. Twenty-eight qualification challenge records are archived from the third-party
  collection maulvialf/CTF-Challs-Archive at commit 5347e5db1a2b2e8381603126a2a236ede111f45d, path
  2023/WreckIT 4.0: six crypto, three forensics, seven misc, three pwn, five rev, and four web. The
  collection keeps a CTFd export at the set root, which supplies the point values, solve counts, and
  author credits used here. No organizer-published challenge set exists, so the edition's
  challenge_materials_imported flag covers third-party provenance; each challenge records verification
  needs_scope_review. The same collection also files an attack-defense set under 2023/final-wreckit-4,
  which was not imported. Four of the web challenges survive only as README files.
