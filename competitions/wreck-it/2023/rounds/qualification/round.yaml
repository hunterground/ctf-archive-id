notes: 'The round is identified from format evidence rather than a source label: Bank Sinarmas and Republika
  both describe the penyisihan as jeopardy across web exploitation, cryptography, reverse engineering,
  pwn, forensic, and misc, and the final as attack-defense. The imported collection holds exactly those
  six jeopardy categories and files a separate attack-defense set under 2023/final-wreckit-4, which is
  not part of this import. Challenge points and solve counts come from the collection''s CTFd export.
  Four web challenges survive only as README files, so their services cannot be reproduced. The set''s
  provenance is a third-party aggregate, which is why the round and its challenges are needs_scope_review
  rather than verified. The collection''s CTFd export is preserved as challs.json at this round directory,
  matching the archive''s existing treatment of platform exports such as find-it-ctf/2024/rounds/qualification/challs.json.
  Its per-file download URLs carried signed access tokens tied to the uploader''s platform account; those
  query strings were removed and only the bare file paths were kept, because the tokens are credentials
  rather than challenge material. Everything else in the export is unchanged.'
