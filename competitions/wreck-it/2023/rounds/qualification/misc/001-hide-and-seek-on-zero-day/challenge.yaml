description: "Dawn bermain sebuah permainan yang sangat menyenangkan sekali bersama dengan teman terbaiknya\
  \ di abad ini yaitu Snork. Permainan yang kita lakukan adalah petak umpet luar biasa dimana Snork akan\
  \ bersembunyi di planet Bumi sedangkan tugas Dawn adalah mencari dimanakah Snork saat ini. Karena Dawn\
  \ sangat pintar dia sebelumnya sudah menempelkan kamera dan alat pendeteksi koordinat di baju Snork.\
  \ Kemudian sesaat sebelum kedua alat tersebut kehabisan data, alat itu meninggalkan beberapa data yang\
  \ sangat berguna yang telah dia sembunyikan dalam secret note.\r\n\r\nSebelum itu, karena mereka berdua\
  \ berteman baik, Dawn juga tahu bahwa Snork sangat suka meninggalkan pesan pada suatu tempat saat dia\
  \ sedang bermain permainan. Dapatkah kamu mengetahui pesan yang ditinggalkan oleh Snork?"
