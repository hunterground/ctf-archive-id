notes: >-
  The final was held on site at Hotel Sari Pan Pacific Jakarta on 10 November 2015, with 16 teams having
  advanced from the online qualification; both facts come from a Fasilkom UI report on the event. The
  imported material is the RNDC participant write-up, not an organizer problem set. It states that it
  covers "beberapa soal final" (some of the final challenges), so the round had more challenges than the
  three archived here. This final set is distinct from the qualification material collected by
  aliansi/soal-cyber-jawara-2015: no challenge name is shared between the two sources.
