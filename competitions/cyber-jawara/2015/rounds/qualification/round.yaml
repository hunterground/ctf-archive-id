notes: >-
  The 2015 event ran as an online qualification (penyisihan) followed by an offline final. A Fasilkom UI
  report states that 208 teams entered and 16 advanced as finalists to the final held 10 November 2015,
  and a participant blog published these challenges with the remark that the online competition had
  finished and the offline finalists had been announced. The aliansi/soal-cyber-jawara-2015 repository,
  collected by team ISA of Forum Open Source Akakom, holds this qualification material as loose
  attachments. No challenge material from this round is imported yet: the source is a flat attachment
  dump with no per-challenge directories and no category labels. Participant blogs identify individual
  files as separate challenges and give their flags, but the mapping from file to event category is not
  stated by the source, so importing it requires an explicit per-file classification decision. The round
  date is not recorded; the qualification ran in September-October 2015, before the 10 November final.
