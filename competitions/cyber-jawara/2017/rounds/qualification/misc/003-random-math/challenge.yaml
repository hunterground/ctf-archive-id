notes: 'The 23 packaged directories name the event in no README; every soal.txt service address points
  at cj2017.ctf.idsirtii.or.id or cj2k17.ctf.idsirtii.or.id, which ties the set to the 2017 Cyber Jawara
  qualification infrastructure. The uploader is a single personal account with one 2017-08-30 commit and
  no README, and nothing states that the owner set the challenges, so authors are left empty. The source
  ships no round label. It is modeled as the qualification round because every challenge is an online
  jeopardy service; no final round material is present. connection_info from soal.txt: nc cj2k17.ctf.idsirtii.or.id
  3939 The source directory holds only soal.txt, and that file contains a single netcat endpoint with
  no problem statement, so no description is derived. The challenge title names the theme, but the source
  states no statement and none is invented here.'
