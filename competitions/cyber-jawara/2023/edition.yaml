notes: >-
  The 2023 edition combined online and on-site rounds and used the same three tracks as later editions:
  National, High-School, and CSIRT Team. The two imported challenge sets are explicitly the high-school
  track ("Tingkat Pelajar"), so only that division holds material; the other tracks are not recorded as
  divisions because no 2023 evidence for them has been imported. The high-school final took place on
  16 December 2023 at Pradita University, Tangerang, which is the recorded edition end date; the start
  date is not recorded. Both imported repositories sit on a personal account and do not state that their
  owner set the challenges, so authors are left empty and the changesets are marked needs_scope_review.
  The material is nonetheless the genuine event set: the qualification tree carries CJ2023{...} flag
  placeholders and links to the official cyberjawara.id/2023 track pages, and the final tree references
  instance hostnames under ctf.cyberjawara.id. An earlier revision of this record cited the FTUI "12th
  national hacking competition" article as 2023 evidence; that article describes the on-site final held
  on 8 February 2025, so the reference was removed here and it is cited by the 2025 edition instead.
