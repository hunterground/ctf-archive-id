notes: >-
  The author repository states that the 2020 final ran online because of the COVID-19 situation.
  It ships no dates. A participant write-up published 18 October 2020 describes the final, so the edition
  is dated no later than that day, but no exact date is recorded. Two stages are imported from different
  sources: the final (13 challenges) from the problem setter's own repository, and the qualification
  (26 challenges) plus a separate warmup stage (3 challenges) from a third-party copy of the challenge
  distributions. The 42-challenge count is the sum of those imported entries. The qualification source
  gives no date and no challenge authors, so authors are empty there.

