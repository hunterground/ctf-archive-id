description: |-
  I should've checked the domain is not from `kaspersky.com` but it's from `kasperky.com`. I'm calling you now to help me investigate since I'm too paranoid and there's this silly process AV that I accidentally run (of course) so I dump it for you to analyze.

  Please do answer all the questions on the remote connection. There are only 5 Questions for you to answer, which is nice!

  `nc {IP} 5112`

  **WARNING: This malware is intended to encrypt files in specific directory. It MIGHT encrypt yours but for safety, please do run the malware inside the VM if necessary.**

  All of the necessary artifacts can be downloaded from the following zip file:

  https://drive.google.com/file/d/1mDBPn49gFFqrac4he0w8jRkAkibP7EDv/view?usp=sharing
