notes: The online qualification was followed by an on-site final on 8 February 2025. Public reporting
  says 45 teams advanced from the online qualification, and the final was hosted by the Faculty of
  Engineering, Universitas Indonesia. The official 2025 site lists four tracks - National, High-School,
  CSIRT Team, and Kedinasan (government-affiliated school) - recorded here as the national, high-school,
  csirt-team, and government-affiliated divisions. The imported organizer repository holds the
  qualification stage only, with 16 national, 14 high-school, and 5 CSIRT Team challenge entries, and
  no material for the government-affiliated track. The edition challenge count is the sum of the
  imported entries; shared challenge names are imported once per division that used them.
  Participant count is left null because the reporting gives finalists, not qualification entrants.
