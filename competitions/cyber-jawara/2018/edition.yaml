notes: The 2018 final was held in Bali during Code Bali 2018, 9-12 October 2018, and the final session
  ran on the evening of 11 October 2018. BSSN's statement reported the Cyber Jawara final on 9 October
  2018; the two dates are kept as the recorded start and end rather than resolved. Only the final stage
  is documented in the imported source. The 12 imported services are the Attack & Defense service
  environments from the author repository, which states that the original cluster images, the A&D platform,
  and the Docker manager are not included.
