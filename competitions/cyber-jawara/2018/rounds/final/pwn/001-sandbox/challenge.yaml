description: In this web service, you can run a sandboxed x64 Linux Shellcode by pasting hex string that
  encodes x64 instructions. Sandboxing is done with a ptrace-based syscall filter to block execve and
  execveat sysall. You need to find the ways to get the flag. For patching, you are only allowed to patch
  sandbox.c. Functionality tests to write a string to stdout or file and read a file will be performed.
