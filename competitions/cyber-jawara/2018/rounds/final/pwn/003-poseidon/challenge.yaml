description: Hackers also need to understand data structure and algorithm. Do you know if ext3 filesystem
  tracks directory entries in a balanced binary search tree using red-black tree? Virtual memory areas
  (VMAs) in Linux are also tracked with red-black trees, as are epoll file descriptors, cryptographic
  keys, and network packets in the "hierarchical token bucket" scheduler. Now, please try to pwn this
  binary search tree service. For patching, you are only allowed to patch 16 bytes. For this service,
  all attack points are multiplied by 1.5x.
