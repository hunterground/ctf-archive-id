description: In-memory key-value database server like Redis and Memcache is widely used for caching in
  a production server. Can you pwn this key-value database service? You need to reverse engineered it
  first to know what data structure is used for storing the data. This service is also run with sandbox.
  For patching, you are only allowed to patch 32 bytes in 'zeus' binary and only 2 bytes in 'zeus_sandbox'.
  For this service, all attack points are multiplied by 2x.
