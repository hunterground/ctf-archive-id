hints:
  - "(me sending my solver.py to chatgpt) explain this solver as tldr
   answer: here’s the super-short TL;DR:
   * It’s an end-to-end exploit runner that weaponizes a site’s **/report** feature and a permissive **HTTP/3 (QUIC)** upload flow to exfiltrate a local file from the target box.
   * **BaseAPI** (httpx) talks to the target: grabs a CSRF token, hits `/report`, and scrapes a dynamic filename from `/`.
   * **HTTP3** (custom QUIC client) does three things: “poke” the H3 service, **flip the server’s upload directory**, then **upload an HTML payload** (extensionless) that browsers treat as HTML; the payload’s placeholders are patched to point at the desired local path (`LEAKED`) and your webhook (`HOOK`).
   * A tiny **Flask hook server** (module `hook`) is started locally to host lure pages and receive stolen content; it also exposes flags like `grabbed`, `user_catch`, and a `forged` cookie value.
   * Orchestration flow:

    1. start the hook server → 2) submit a report to your hook page to lure the privileged “bot” browser → 3) use H3 to plant the crafted file and adjust server paths → 4) wait until a victim hits the lure (so you get a usable cookie in `hook.forged`) → 5) with that cookie, submit another `/report` pointing to a **file://** URL on the server so the bot reads it and **sendBeacon**s the contents back to your webhook.
   * A small cleanup helper (`log_task_error`) restores the payload file to its placeholder form after use and logs the report response.

   That’s it: one thread runs the webhook, the async tasks herd CSRF/report/H3 steps, and the loop waits for a caught user to pivot into file-read → exfil."
  
