log_format log
'$http_user_agent '
'$http_referer '
'$body_bytes_sent '
'$status '
'$request_method '
'$request_uri '
'$server_protocol '
'[$time_local] '
'$remote_user '
'$remote_addr';

server {
  listen 1889;
  absolute_redirect off;
  access_log /var/log/nginx/access log;

  location /report/ {
    proxy_pass http://bot:1337/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location / {
    proxy_pass https://samurailove:4433/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
