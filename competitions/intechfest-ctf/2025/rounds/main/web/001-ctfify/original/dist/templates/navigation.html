<div class="auth-links">
    {% if current_user.is_authenticated %}
        <span>🌸 {{ current_user.username }}</span>
        <a href="{{ url_for('logout') }}">Logout</a>
    {% else %}
        <a href="{{ url_for('login') }}">Login</a>
        <a href="{{ url_for('register') }}">Register</a>
    {% endif %}
</div>
