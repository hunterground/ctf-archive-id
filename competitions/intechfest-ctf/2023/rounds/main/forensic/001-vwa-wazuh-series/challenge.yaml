description: >
  A self-contained mini SOC lab built around Wazuh. Four intentionally vulnerable web apps
  (SQL injection, SSTI, LFI, PHP arbitrary file upload) run behind a proxy alongside Wazuh
  indexer/dashboard/manager and a Kali attacker container. The challenge concerns detecting
  and analysing the simulated attacks with Wazuh.
