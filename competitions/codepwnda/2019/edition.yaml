notes: >-
  Repository & Imported Challenges
  - Source & Breakdown: 31 challenges were imported from vidner/codepwnda-ctf (commit 7e086044b753fe555b44395b79827d2f5b89da1d), 
    distributed across crypto (8), rev (8), web (7), pwn (6), and forensics (2). The misc/ directory contains only a README and 
    is excluded as a category.
  - HackToday Lineage: Seven challenges (babyrsa, rsa-goes-skrrrahh, ezrop_revenge, kudanil_lsi2, quickie, vmxck, and back2basic) 
    are archived HackToday 2019 problems, as noted in commit messages and external writeups. They are kept under codepwnda 
    (with their lineage documented per challenge) rather than duplicated into a separate HackToday 2019 edition.
  
  Preservation & Artifact Handling
  - Author vs. Solver Artifacts: Author working files (e.g., .gdb_history, peda-session-cin.txt, banners) were preserved as shipped, 
    while 20 solver files were relocated to solvers/ directories per archive policy. Only web/master-dukun/__pycache__ was omitted 
    as generated bytecode.
  - Licensing: Covered by the MIT License (Copyright 2019 Rendi Yuda Perkasa) declared inside README.md, which is preserved as 
    redistribution evidence for all imported challenges.
  
  Metadata & Attribution
  - Curator Summaries & Authors: Because the repository lacks per-challenge descriptions, authors, or difficulty levels (a "Skor : 100" 
    note in kudanil_lsi2 reflects points rather than difficulty), descriptions are curator-written, difficulty remains unknown (null), 
    and authors are attributed to the initial commit creators for each directory.
  - Dates: No competition schedule was established beyond the repository creation date (September 29, 2019) and public announcement (October 3, 2019).
