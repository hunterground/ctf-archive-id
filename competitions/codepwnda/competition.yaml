notes: >-
  Identity & Classification
  - Distinct Competition: Announced on October 3, 2019, by Cyber Security IPB (Usman Abdul Halim), 
    codepwnda was released on ctf.codepwnda.id featuring new challenges alongside archived HackToday problems.
  - Separation from HackToday: Although HackToday (2019 and 2020) was hosted on a related subdomain (not.codepwnda.id), 
    codepwnda is recorded as a standalone competition rather than a HackToday edition because it had a separate announcement, 
    its own repository (created September 29, 2019, by Rendi Yuda Perkasa), and a distinct codepwnda{...} flag format.

  Scope & Open Questions
  - Single Edition: Only the 2019 release is recorded, with no evidence of subsequent editions.
  - Unverified Format & Metrics: Because no official event page, schedule, or scoreboard was found, dates, participant_count, 
    and challenge_count remain null. It is unclear whether it ran as a timed competition or a practice platform, so 
    its single stage is logged as main under type other.
  - Licensing: Governed only by an MIT license notice in the repository's README, with no standalone license file.
