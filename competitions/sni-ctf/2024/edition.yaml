notes: >
  Event Overview
  - Schedule & Scale: A 36-hour competition held November 23-24, 2024 (per participant reports), featuring 36 reported challenges.

  Repository & Imported Materials
  - Source & Licensing: Tracked files from 31 challenge directories were imported from the public organizer repository 
    (commit 3bfdf0ad92784d86408a7263a3166931f54a4177), treated under an MIT license per maintainer instruction on November 21, 2026. 
    Five of the 36 reported challenges are absent and unnamed in the repository.
  - External Assets & Omissions: On November 22, 2026, konnichiwa.zip and pf-ing/dist.rar were retrieved from external Google Drive and Mega links. 
    However, Forensic/quotes of the day remains an undownloaded Google Drive link, and an external author write-up repo 
    (jonscafe/ctfs-write-ups for pf-ing and my-seniors) was not downloaded.
  - Boot2root Structure: These challenges reference a single TryHackMe room without bundled VM images, with sequence numbers ordering 
    each machine's user flag prior to its root flag.
