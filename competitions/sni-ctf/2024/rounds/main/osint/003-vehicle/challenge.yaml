description: "X sedang melakukan program magang di suatu BUMD di Kota Kembang. Setiap jam istirahat, X\
  \ selalu makan siang di warteg ijo dekat kantornya. Tepat di seberang warteg, terlihat sekilas sebuah\
  \ ruko yang namanya mirip dengan kampus yang termasuk top 3 PTN di Indonesia. Di salah satu kota terkecil\
  \ di Indonesia, terdapat perusahaan yang memiliki nama yang persis sama dengan ruko tersebut. Di media\
  \ sosial perusahaan itu, X menemukan nomor plat kendaraan yang berasal dari Kota Kembang. Karena rasa\
  \ penasarannya yang tinggi sejak lahir, bantulah X untuk mencari detail sepeda motor tersebut!\n\nFormat\
  \ flag: SNI{Merek_Model_Jumlah CC (angka saja)_Tahun Akhir STNK}\n\nPastikan flag ditulis huruf kecil\
  \ semua dan tanpa spasi \n\n**frennn**"
