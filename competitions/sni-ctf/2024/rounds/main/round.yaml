notes: The organizer repository publishes one challenge set and does not describe a qualifier or final,
  so this round id is main. Sequence numbers are alphabetical by source directory name within each category,
  except Boot2root, where each machine's user flag is numbered before its root flag and the machines
  stay in alphabetical order.
  Where challenge.yml uses dynamic scoring, difficulty is extra.initial. A qualitative category-README
  difficulty is used only when no positive score is stated. The repository has no LICENSE file.
  On 2026-11-21 the archive was instructed to treat this source as MIT, and the tracked files from
  each challenge directory were copied. Konnichiwa and pf-ing attachments were added on 2026-11-22
  from the links in the organizer repository. quotes of the day and the Boot2root TryHackMe image
  were not downloaded.
