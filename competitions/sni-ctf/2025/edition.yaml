notes: >
  Event Overview
  - Schedule & Audience: Held November 22-23, 2025, as a national Capture the Flag competition for high school and vocational school (SMA and SMK) students.

  Repository & Imported Materials
  - Source & Licensing: Tracked files from 15 challenge directories were imported from the official 
    2025 organizer repository (commit ce5f5e9e155b54a89049c17634fc93d2080b6861), treated under an 
    MIT license per maintainer instruction on November 21, 2026. The Misc category README lists no challenges.
  - Submodules & Shared Configuration: Web/curl sim/src/app was copied (without its .git directory) from a gitlink 
    pointing to mkhizeryounas/bun-express (0ff1065bd881c53de967619b109cc49135bdc7ab). 
    Both Web/curl sim and Web/photo_gallery share the same recorded connection string.
  - Omissions: Forensic/oh noooo links to an external Google Drive folder that was not downloaded. Additionally, 
    two challenges named in external participant write-ups—Cihuy (crypto) and SNI BASECAMP (web)—are missing from this commit, 
    and those write-ups were not downloaded.
