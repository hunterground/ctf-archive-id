description: >-
  Agrihack is the cybersecurity Capture The Flag competition run by Cyber Security IPB (CSI),
  the cybersecurity student community of Himalkom IPB University. It is part of Agrinformatics,
  the Himalkom IPB program that hosts selection competitions for the university's student tech
  communities, and it doubles as CSI's recruitment selection for IPB University students.
