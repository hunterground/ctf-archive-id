notes: >-
  Edition numbering is hexadecimal: the archive holds 0x08 (2023) and 0x09 (2024), and public
  writeups attest 0x07 (2022) and 0x0A (2025). Edision numbers are preserved in the edition
  names; directory years stay four-digit because the archive requires a year directory. The
  first edition is not established: 0x07 being "the 7th Agrihack" implies earlier editions, but
  no year for them has been verified, so established_year stays null. The 0x0A account describes
  Agrinformatics as the parent Himalkom IPB program with CSI as one of its selection tracks, and
  puts the qualification at 30 September - 1 November 2025 with a final on 8 November 2025,
  matching the qual/final structure seen in the 2023 and 2024 sources.

  Catalogs: the 2023 source is a public repository under an Agrihack author's personal handle
  (naufalardhani) rather than the CSI organization; the CSI organization also hosts
  Agrihack-0x08-platform, a CTFd fork, but no 2023 challenge repository of its own. A
  cybersecurityipb/Agrihack-0x08-chall URL appears in search indexes but returns HTTP 404 on
  2026-11-26, so it is not cited as a live source. The 2024 source is published directly by the
  CSI organization. The 2023 record stays at verification corroborated because its provenance is
  an author copy, not an organization-published tree.

  Licensing: the 2023 repository carries an MIT LICENSE naming Numero Uno Arroefy, and each
  imported 2023 challenge records it. The 2024 repository has no license file at all, so every
  imported 2024 challenge follows the archive maintainer instruction of 2026-11-26 that treats a
  source with no license as MIT, and its permission_reference says so explicitly.

  Secondary sources noted but not imported: ilhamAdil/WriteUp-Agrihack-2020 (2020 participant
  writeup), ValenYanto/agrihack0x0b-ctfd (a CTFd instance for 0x0B, license Apache-2.0), the
  0x07 early-challenge writeup and the 0x0A writeup listed above, and cybersecurityipb/CTF-Archive
  (CSI's own collection of solvers and writeups). None of these supplied challenge files to this
  archive.

  Outstanding downloads: several 2023 forensics attachments are published only as Google Drive
  links, and one final forensics attachment was hosted on filetransfer.io. See the individual
  challenge records and missing.txt.
