description: A Flask web challenge that stores user paths and renders them with render_template_string. A blacklist blocks config, class, mro, import, builtins, popen, system, eval, exec, url_for, request, update, subprocess and numerous punctuation characters, so a server-side template injection payload has to be built without them to reach the flag location and flag reader configured on the app.
