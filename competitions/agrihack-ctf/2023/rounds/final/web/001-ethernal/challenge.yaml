description: 'A web challenge with two services: a PHP page that checks whether a supplied host or IP is reachable, and an internal Flask service that returns the flag. The PHP page blacklists 10.10, 10.10.0.5, 127.0.0.1 and 127.0, and the flag service sits on an internal Docker network address (10.10.0.5), so the blacklist has to be bypassed to reach it.'
