description: 'Saat aku sedang praktikum di labkom, aku iseng2 mencoba menghubungi komputer teman, karena semua komputer di labkom ada dalam satu network yang sama. Rupanya, cara berkomunikasi seperti ini tidak aman dan isi pesannya dapat dilihat oleh siapapun yang menggunakan network labkom (file di bawah adalah hasil tangkapan packet2 yang dikirim di dalam network labkom pada saat itu).


  Hint: file `*.pcapng` dapat dianalisis menggunakan tool `Wireshark`. Selamat belajar! ;)'
