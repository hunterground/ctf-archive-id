description: "Pengetahuan yang baik dalam modular arithmetic akan sangat membantumu dalam crypto, terutama dalam memahami beberapa algoritma seperti RSA dan Diffie-Hellman. Kalau begitu, mari mulai dari basic-nya. Zaman dahulu kala, Euclid menemukan sebuah cara untuk menghitung faktor persekutuan terbesar/greatest common divisor (GCD) dari dua bilangan bulat `a` dan `b` dengan cepat (Euclidean algortihm). \n\nMemperluas algoritmanya (Extended euclidean algorithm), kita juga bisa menemukan bilangan bulat `x` dan `y` yang memenuhi `ax + by = gcd(a,b)`."
