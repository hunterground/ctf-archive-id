description: 'Saya membuat algoritma kombinasi beberapa encoding, apakah kalian bisa membuatkan saya sebuah script untuk mendecode flag nya?

  Pahami algoritmanya dan buatkan script untuk mengembalikan flag menjadi semula. Flag berada di output.txt, saya harap anda tidak menggunakan AI untuk

  menyelesaikan soal ini, biar lebih menantang dan bisa menambah ilmu kalian. Nanti saat bikin solvernya untuk mendapatkan flagnya

  hasil decode nya harus lowercase, bisa menggunakan fungsi lower() pada python.'
