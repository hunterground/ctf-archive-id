description: 'A PHP web challenge built on an XXE vulnerability: process.php parses the raw request body with DOMDocument and LIBXML_NOENT | LIBXML_DTDLOAD, then echoes the parsed username. The distribution ships a PHP/Apache image, a small front-end, and an author solver that combines XXE with the expect:// wrapper to reach remote code execution.'
