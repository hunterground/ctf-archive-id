notes: 'The organizer repository ships a bare qual/misc/email.zip with no challenge.yml and no per-challenge directory, so there is no Agrihack title for it. The zip member is a HackToday 2023 challenge: its flag uses the hacktoday{} format and the same material is already archived at competitions/hacktoday-ctf/2023/rounds/final/misc/002-email-kompani. It is preserved here as an opaque zip exactly as distributed, and whether the organizer intended it as an Agrihack 0x09 challenge is unresolved.'
