notes: JOINTS as a festival says it was first held in 2001. That year is not recorded as the first CTF.
  Editions with a documented CTF are 2021, 2023, and 2026. No 2022, 2024, or 2025 CTF edition was found.
  The 2021 problem set is published by OmahTI UGM, the HIMAKOM UGM information-technology student
  organization, which describes the repository as the official probset of CTF JOINTS 2021. Only the 2021
  edition has challenge material from an organizer or author; no official repository was found for 2023 or
  2026, so those editions remain metadata-only.
