description: Ketua OSSIS SMA Negeri Tra La La memberikan give away kepada siapa saja yang berhasil untuk
  memecahkan kode rahasia yang telah disembunyikan. Karena Ketua OSSIS SMA Negeri Tra La La adalah orang
  yang baik hati, dia memberikan hint untuk membantu para hekel agar tidak kesusahan saat memecahkan kode
  rahasianya. Sebagai seorang hekel yang bijaksana, baik hati, tidak sombong dan suka menabung anda akan
  menyelesaikan kode rahasia tersebut dengan sepenuh hati. Pecahkanlah kode rahasia itu agar bisa mendapatkan
  give away.
