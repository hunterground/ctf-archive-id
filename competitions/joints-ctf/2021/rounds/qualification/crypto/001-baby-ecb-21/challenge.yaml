description: Mas Suryo dan Mas Dewo berusaha membuat penelitan tentang kelemahan algoritma AES pada mode
  ECB. Namun karena mereka putus asa, akhirnya mereka hanya membuat sistem autentikasi dengan memanfaatkan
  algoritma enkripsi AES ECB. Bantulah Mas Suryo dan Dewo untuk menyelesaikan penelitiannya, buktikan
  bahwa sistem autentikasi mereka bisa dijebol meskipun anda tidak mengetahui soskod.
