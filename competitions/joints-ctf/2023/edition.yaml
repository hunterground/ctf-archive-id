notes: >
  HIMAKOM UGM organized the CTF. Warm-up on 9 April 2023, qualification on 16 April 2023, and final
  on 20 May 2023, online. No organizer- or author-published challenge repository was found for this
  edition. Secondary sources only, recorded for review:
  (1) CTF Pal lists six qualification challenges with published solutions — Decrypt, Dinosaur,
  Easy CBC, Quals JCTF yesterday afternoons kidz, Vision, and whereIsThis — and assigns no category,
  while writeups place them in OSINT, Forensics, Misc, Web, Pwn, and Crypto; 
  (2) cipichop/CTFs holdsqualification (Forensics Dinosaur, Misc Mega SUS, Misc Strange Message, 
  Forensics Spartan Ghosts, Pwn Book Store) and final (Forensics Ethereal, Forensics CustomSteg, 
  Rev Impossible Game) writeups;
  (3) UrSourceCode/ctf-writeup holds Web Vision, OSINT whereIsThis, Forensics Dinosaur, and Crypto
  Easy CBC writeups; (4) a pandadevelopment.net PDF lists Osint, Forensic, MISC, Web, Binary
  Exploitation, Reverse Engineering, and Crypto challenge names for the same qualification event.
  These are third-party collections and writeups, not the challenge distribution, and are not
  authoritative for categories, authors, or challenge counts. The flag format used in the 2023
  qualification was JCTF2023{...} as reported by those writeups. Challenge count and participant
  count are unverified.
