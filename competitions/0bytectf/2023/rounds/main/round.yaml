notes: The official event page gives one window, 19 August 2023 07:00 +07:00 to 20 August 2023 00:00 +07:00,
  with no qualifier or final, so the round uses id main and type other. The edition publishes no challenge
  list and no total; 17 challenge names, categories, and point values were recovered from Wayback Machine
  captures of the event CTFd instance's per-user solves API, and the pwn challenge Sistem Anti Hek is
  documented by its author but absent from those captures, so 18 challenges are known and the true total
  is unknown. Only the pwn category had primary author material and is the only category imported here;
  the other recovered challenges are listed in the edition notes and are not yet archived.
