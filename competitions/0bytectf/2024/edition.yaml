notes: Independence Day edition marking Indonesia's 79th anniversary, with 350 participants. The official
  page's timeline dates registration to 13 August, registration closing to 17 August, the competition
  ("Fight!") to 18 August, and the winner and reward announcement to 23 August 2024; the 18 August competition
  day is recorded as the edition window. Categories stated by the page are web exploitation, cryptography,
  digital forensic, pwn, reverse engineering, OSINT, and boot to root. No challenge list or archived CTFd
  instance was found for 2024, so the edition challenge count is unknown. Only the pwn category has primary
  author material available and was imported. No participant writeup collection, challenge archive, or
  other secondary source for this edition was found during research.
