notes: >
  The Pusbang Proserti announcement describes the 2024 edition as a national CTF held with the
  Talent Scouting Academy and partners, with 759 participants in 267 teams and an award ceremony
  at STMM Yogyakarta on 23 December 2024. It does not state whether the event is annual, and no
  second edition has been found, so recurring stays null rather than true. The same announcement
  gives the organizer as Pusbang Proserti; TSA and Cyberkarta are recorded as partners in the
  description instead of as the organizing body. An ITN Malang article and a winner's LinkedIn
  post both call 2024 a first-time event, which is participant-side evidence and not used to set
  recurring. Secondary sources reviewed but not imported: ctfpal.com, the abdinata and azuketto
  HackMD writeups, and xiao-caomay's GitBook. No competition-level website distinct from the
  Digital Talent Scholarship portal was found.
