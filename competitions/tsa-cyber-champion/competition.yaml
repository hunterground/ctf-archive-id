description: >
  National Capture The Flag competition of the Talent Scouting Academy (TSA) program under
  Indonesia's Digital Talent Scholarship, run by Pusat Pengembangan Profesi dan Sertifikasi
  (Pusbang Proserti), Kementerian Komunikasi dan Digital, with Cyberkarta, Cisco NetAcad
  Indonesia, International Test Center (ITC), and Sekolah Tinggi Multi Media (STMM) Yogyakarta
  as partners. Entry is limited to active and alumni university students across Indonesia aged
  at most 29, in teams of one to four.
