notes: >
  No organizer source describes a qualification, semifinal, or final stage, so the edition is
  modelled as one round with id main and type other. The event README describes a single 15-hour
  window on 9-10 November 2024 and the organizer announcement reports one CTF result list; no
  separate stage is created. The source publishes two sets inside that one events tree: a
  CHALLS-101 directory of five beginner-tier challenges, and five per-category directories with
  fifteen further challenges. Both sets are placed in this single round because participant
  writeups treat the 101 challenges as part of the same event and no source states that they were
  a separate stage. Open question for review: if the organizer confirms that CHALLS-101 ran as a
  distinct warm-up stage, those five challenges should move to a warmup round. Sequence numbers
  follow the source order within each category, with the 101 challenge first. Category directories
  use the archive vocabulary and original_category preserves each source label, including the
  CHALLS-101 prefixed labels. Difficulty values are organizer points where the source challenge
  manifest states them; the 101 challenges carry no organizer-stated value and stay null even
  though participant writeups report 50 points each, because a scoreboard seen by a participant is
  not an organizer-published difficulty.
