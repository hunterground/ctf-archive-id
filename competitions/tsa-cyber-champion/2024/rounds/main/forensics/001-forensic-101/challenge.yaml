notes: Beginner-tier challenge from the source's CHALLS-101 set. Participants received release/packet.pcap;
  generate/ holds the image stager that produced the payload. The preserved README still carries
  a netcomp{Sending_file_through_ICMP} flag, so this challenge reuses material from the same author's
  NETCOMP UGM 2023 warm-up set, which is also in this collection. The flag format expected at TSA
  was TSA{...}.
