notes: >-
  BeeFest 2022 BeeCTF was the Capture-the-Flag branch of BINUS University's BeeFest, organized by
  the university's Cyber Security department. It was held offline on 6 November 2022 at the BINUS@Anggrek
  campus in Jakarta, with qualification and final stages (CTF Pal lists "BeeFest 2022 quals").
  Participants reported gold and bronze medal results. No official 2022 challenge repository was
  located; PETIR Cyber Security, the BeeCTF problemsetter organization for 2025+, was created in 2024
  and its ctf-archive holds only 2024 events, so no 2022 material is present there. Writeups appear in
  community collections (e.g. 53buahapel/kumpulan-CTF-writeup) as secondary sources only. Challenge
  materials are therefore not yet imported, and redistribution for any 2022 challenges is
  unestablished.