notes: >-
  BeeCTF is the Capture-the-Flag branch of BINUS University's BeeFest series, aimed at high-school
  students. A 2022 edition (BeeFest 2022) is corroborated by participant reports and a community
  writeup collection; it was held offline on 6 November 2022. The 2026 announcement page reviewed here
  does not say whether every intervening year used the same name. The CTF format label (jeopardy-style)
  was not explicitly stated.
