version: '3'

services:
  challenge:
    container_name: crossfire-chall
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    expose:
      - "3000"
    networks:
      - internal
  proxy:
    container_name: crossfire-proxy
    image: nginx:latest
    restart: always
    ports:
      - 8085:80
    volumes:
      - ./proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal
    depends_on:
      - challenge
      - bot
  bot:
    container_name: crossfire-bot
    build:
      context: bot
      args:
        - BROWSER=chromium
    restart: always
    environment:
      APPNAME: Admin
      APPURL: http://proxy/
      APPURLREGEX: ^http(|s)://.*$
      APPFLAG: BEECTF{xss_and_csp_bypass_jsdelivr}
      APPLIMIT: 2
      APPLIMITTIME: 60
      USE_PROXY: 1
    networks:
      - internal

networks:
  internal:
