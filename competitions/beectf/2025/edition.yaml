notes: >-
  BeeFest 2025 was held by BINUS University in collaboration with the PETIR Cyber
  Security team. The cybersecurity branch, BeeCTF, is aimed at high-school students.
  Twenty-two challenges were imported from the official problemsetter repositories:
  twelve qualification challenges from PETIRsec/beectf-2025-qual and ten final
  challenges from PETIRsec/beectf-2025-final (neither carries a LICENSE file; treated
  as MIT per archive policy). The repositories carry no event date, so dates are left
  null. Several forensics and reverse challenges host their evidence externally
  (Google Drive, SharePoint, and one GitHub link), listed in missing.txt and not yet
  downloaded.