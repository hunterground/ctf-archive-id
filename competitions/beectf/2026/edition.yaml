notes: >-
  BeeFest 2026 was held by BINUS University in collaboration with the PETIR Cyber
  Security team. The cybersecurity branch, BeeCTF, is aimed at high-school students.
  Twenty-five challenges were imported from the official problemsetter repositories:
  fifteen qualification challenges from PETIRsec/beefest-2026-qual and ten final
  challenges from PETIRsec/beefest-2026-final (neither carries a LICENSE file; treated
  as MIT per archive policy). Registration for the 2026 competitions, including Bee
  Capture the Flag, was 17 June through 24 August 2026. The competition date was not
  stated.