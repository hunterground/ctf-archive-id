notes: >-
  The service ships a docker-compose.yaml exposing port 5002 and a run.sh that serves app/ with
  php -S for local use; both are preserved. login.php hardcodes the credentials gerex2025 /
  UCSisTHEbestUKM!!! and, on success, sets $_SESSION['loggedin'] plus a user cookie whose value is
  SobatMahakarya. index.php then renders the flag only when that cookie equals Aro, so the
  credential alone is not enough and the participant has to tamper the cookie value. Both the
  credentials and the flag sit in the shipped source and are preserved there rather than copied
  into metadata.
