notes: >-
  The organizer README spells the technique LeFi while the challenge targets local file inclusion;
  the README wording is preserved and not corrected. index.php blocks only the substring '..', and
  its second branch accepts any query that starts with '/', so /flag.txt is reachable directly.
  The service is a php:8.2-apache image with html/ copied to /var/www/html and flag.txt at the
  filesystem root, mounted read-only by docker-compose.yml on port 5001. The Dockerfile also
  overwrites /usr/local/lib/php/pearcmd.php with a taunt, which disables the usual pearcmd
  file-write route rather than enabling it. source/LeFi-EZ/flag.txt ships the live flag and is
  preserved as part of the distribution.
