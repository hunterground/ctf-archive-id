notes: >-
  release/satusendokaja.png is 240,676 bytes. Its first eight bytes are E4 98 74 05 0D 0A 1A 0A
  instead of the PNG signature 89 50 4E 47 0D 0A 1A 0A, so file(1) reports it as generic data while
  the rest of the container is intact: IHDR begins at offset 12, an eXIf chunk follows, and a
  well-formed IEND chunk closes the image at offset 240,643. Twenty-five bytes remain after that
  IEND chunk, and they are the flag in clear. The challenge is therefore an appended-data-after-IEND
  case with a broken signature, and oguri chewed the signature rather than the flag. The file is
  preserved verbatim with no repair, and the trailing flag is not copied into metadata. source/
  contains only an empty .gitkeep placeholder.
