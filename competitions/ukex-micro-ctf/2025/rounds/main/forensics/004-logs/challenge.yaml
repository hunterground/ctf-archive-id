notes: >-
  release/logs.json is 434 KB of newline-delimited JSON, 1,770 records, each holding a timestamp, a
  127.0.0.1 client address, a SQL query and its result set. Every record is a variation of
  SELECT * FROM users WHERE username = 'admin' AND password = <payload> returning the same three
  users, so the artefact is a brute-forced injection log rather than a web server access log. The
  flag is split across two base64-encoded password values in those result rows. The file is
  preserved unchanged and the encoded halves are not copied into metadata.
