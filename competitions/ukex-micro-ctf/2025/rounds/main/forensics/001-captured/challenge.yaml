notes: >-
  release/chall.pcap is a 3.3 MB classic libpcap file with link type 0 (BSD loopback), so every
  record is prefixed with a 4-byte address family instead of an Ethernet header; tcpdump reads it
  as 127.0.0.1 to 127.0.0.1 traffic. It holds 418 records: 400 TCP, 14 ICMP and 2 UDP, starting
  with a short ICMP echo sequence and then curl/8.7.1 requests to a Python BaseHTTP server on port
  5000 that take a cmd= parameter. The trail walks through ls, id, whoami, cat satu.txt, an echo of
  a base64 fragment into dua.txt, and an xxd of deepdive/tiga.png, so the capture is a multi-step
  evidence trail rather than a single packet. The file is preserved unchanged and the recovered
  fragments are not copied into metadata.
