notes: >-
  Round Structure
  - Single Stage: The organizer repository has no qualifier, final, or division split. All twelve
    challenges sit directly under crypto/, forensic/, and web/, so this edition has one round with id
    main and type other.
  - Publication Dates: The repository commits run from 2025-08-18 to 2025-08-21, matching the UKM
    Expo ITS 2025 window of 18-21 August 2025 in the ITS academic calendar decision and the ITS News
    report. No CTF-specific schedule or scoreboard was found, so edition and round dates are null
    rather than inferred from the host fair.

  Category Mapping
  - Source Labels: crypto (4), forensic (4), and web (4) are kept as the source labels and normalized
    to the archive's crypto, forensics, and web directories.
  - No Pwn Or Rev: The repository has no pwn or reverse engineering directory. One challenge in the
    crypto directory is named "is this crypto or rev" and whose decrypt step is a subtraction loop,
    but it stays in crypto because that is the category the organizer published it under.

  Preservation & Artifact Handling
  - Files Copied: All 54 files in the twelve challenge directories were copied byte for byte and
    verified by SHA-256 against the checkout.
  - Repository Tooling: The root README.md is a repository template guide rather than challenge
    material and is not copied into challenge directories. The root LICENSE is preserved once at
    competitions/ukex-micro-ctf/2025/rounds/main/LICENSE because it covers the whole repository.
  - .gitkeep Placeholders: Four challenges ship empty source/ directories whose only content is a
    .gitkeep (Back to Base-ic, leethaxXOR, headache, invisible ink). They are preserved as part of the
    distribution.
  - Solver Material: The repository has no solver, solve, or exploit directory or script. Its
    repository README requires a poc/ directory per challenge, but the only one present is
    crypto/is this crypto or rev/poc/flag.enc, which is a duplicate of that challenge's release
    attachment rather than a solver, so nothing was moved to solvers/.
  - Flags: Several originals ship the flag in a README, in a flag.txt, or in a hidden page. They are
    preserved as part of the distribution and were not copied into metadata.
  - Submodules And External Links: The repository declares no .gitmodules and no challenge README
    links an external download host. Nothing is outstanding for download.
