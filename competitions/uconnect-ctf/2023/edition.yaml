notes: >-
  The Cybersecurity Hackathon final was held on 23 May 2023 at Kemendikbudristek
  Gedung D, Jakarta, with judge and write-up sessions on 24 May 2023. Ten pwn
  challenges are archived: five from the qualification (uBof, uCalc, uNote,
  uStats, uSystem) and five from the final (uDecide, uMemo, uNote v2, uSystem
  v2, Who R U). All challenges were created by Lychnobyte (afmaghribi, Ahmad
  Fauzzan Maghribi) and are imported from the author repository
  afmaghribi/my-pwnyable. The qualification date is not established and is left
  null. Only the pwn category set is represented, so the edition import is
  partial.