description: >-
  A format string pwn challenge (Who R U). The author README describes the
  program as "Sebuah program menanyakan nama" (a program that asks your name).
  The intended solve abuses a format string to overwrite strlen in the GOT with
  system and overwrites .fini_array to re-enter getnline so a second input of
  /bin/sh spawns a shell; the payload is under 64 bytes.
