description: >-
  A stack out-of-bounds pwn challenge (uDecide). The author README describes the
  program as "Sebuah program menerima input dari pengguna, dengan panjang yang
  ditentukan pengguna" (a program that receives user input with a user-defined
  length). The intended solve submits a negative input size to drive an alloca
  overflow, overwrites the return address to leak libc, and ret2libc to spawn a
  shell.
