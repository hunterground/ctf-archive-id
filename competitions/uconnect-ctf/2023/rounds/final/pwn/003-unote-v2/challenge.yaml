notes: >-
  Final pwn challenge. Primary author distribution from Lychnobyte (afmaghribi).
  The distribution is the uNote v2 challenge directory (Dockerfile, compose.yml,
  src/ source and build files, dist/ attachment, README.md), shipping its own
  glibc and ld-linux runtimes under src/ and dist/. The solver exploit
  (writeup/exploit.py) was moved to solvers/ at the mirrored challenge path;
  writeup/README.md remains in the distribution. No flag appears in this
  metadata. Difficulty per the author README table ("Medium").