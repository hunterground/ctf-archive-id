description: >-
  A stack buffer overflow pwn challenge (uBof). The author README describes the
  program as "Sebuah program menerima input dari pengguna" (a program that
  receives input from the user). The intended solve is a limited-input buffer
  overflow that reaches the return address using the vsyscall trampoline,
  since PIE is enabled and there is no address leak.
