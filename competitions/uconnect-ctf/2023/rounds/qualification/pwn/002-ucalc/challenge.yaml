description: >-
  A stack overflow pwn challenge (uCalc). The author README describes the
  program as "Sebuah program kalkulator sederhana" (a simple calculator). The
  intended solve uses a memcpy() overflow of a stored-result variable to build
  a ROP chain on the static binary to obtain a shell.
