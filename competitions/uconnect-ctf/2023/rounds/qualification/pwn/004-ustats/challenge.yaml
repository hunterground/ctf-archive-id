description: >-
  A stack overflow pwn challenge (uStats). The author README describes the
  program as "Sebuah program untuk menghitung statistik dari input yang
  dimasukkan pengguna" (a program that computes statistics from user input). The
  intended solve overflows the stored data (the total is bounded), converts the
  input to double, bypasses the canary with a '.', then leaks libc to ret2libc.
