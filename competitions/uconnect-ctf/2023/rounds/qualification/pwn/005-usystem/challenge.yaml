description: >-
  A stack overflow pwn challenge (uSystem). The author README describes the
  program as "Sebuah program login sistem" (a system login program). The
  intended solve overflows the buf variable whose length depends on the
  password, leaks the canary and libc main+243 to derive the libc base, then
  uses a one_gadget to drop a shell.
