notes: >-
  The 2023 edition was organized and hosted by InfraDigital Foundation, held at
  Kemendikbudristek Gedung D in Jakarta. The Cybersecurity Hackathon final took
  place on 23 May 2023 with judge/write-up sessions on 24 May 2023. The 2022
  predecessor ran under the name "Cyberwarriors". Only the 2023 edition is
  archived here; the organizer website is not known and is left null. Only the
  pwn challenge set is represented, authored by Lychnobyte (afmaghribi, Ahmad
  Fauzzan Maghribi), so the edition import is partial.