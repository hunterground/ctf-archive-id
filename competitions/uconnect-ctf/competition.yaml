description: >-
  U-Connect (Cybersecurity Hackathon) is the Capture the Flag competition of the
  annual U-Connect event run by InfraDigital Foundation (PT. Infra Digital
  Foundation), a Jakarta-based education foundation. The 2023 event was held at
  the Ministry of Education (Kemendikbudristek) with support from Grab,
  Telkomsigma, Lintasarta, ISACA, and OVO; the top 15 teams competed on CTF
  challenges. The competition has a qualification (qual) stage and an onsite
  final stage.
