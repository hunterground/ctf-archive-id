notes: >-
  Imported primarily from the dedicated organizer archive porosub/hology3-penyisihan-public (Arsip Soal
  CTF Hology 3.0 Penyisihan, Divisi Security POROS), which is MIT-licensed (Copyright (c) 2020 Divisi
  Security POROS) and whose README states the challenges are open for anyone to attempt. Its file
  contents are byte-for-byte identical to the HOLOGY 3.0/Penyisihan tree in porosub/infra-ctf (POROS UB,
  Divisi Operations), retained as a secondary reference. HOLOGY 3.0 was inferred as 2020 by the archive
  curator because the organizer repository documents HOLOGY 4.0 as 2021 and the editions are sequential.
  This edition has a single stage (Penyisihan). Seventeen qualification challenges were imported across
  osint (2), pwn (2), crypto (4), forensics (4), rev (2), and web (3). challenge_count reflects the
  seventeen imported challenges only.