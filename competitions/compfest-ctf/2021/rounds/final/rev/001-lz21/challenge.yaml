description: Mr Smolin is a newbie programmer who likes using a program called Smallify to reduce his file sizes. He's always liked LZ77, one day he wanted to write his own LZ77, called LZ21, and tested it on some files including Smallify, but then he didn't know how to retrieve them :(. Today, he's also forgotten his Smallify password. Can you help him recover his files? He's said there'll be a prize for the one to help recover his password too! Wrap the program's pass key with COMPFEST13{} as flag.
