description: It's valentine's day. You decided to stay in your room since you don't want to see couples walking outside. The only chocolate you got was from your mom and was eaten an hour ago. Few moments later, your highschool friend, Naomi sends you a gift. Instead of chocolate, she gave you a memory image of her computer. "Cheer up! Here's a chocolate for you, but you have to get it yourself. There's a Hypertext Transfer Protocol Secure link that you have to find. Next step you'll figure them out by yourself. The chocolate is located at the end of each file, " she said. Immediately you ran to your study desk. "I have to figure out how to get this gift, it's the only gift I got," you thought.
