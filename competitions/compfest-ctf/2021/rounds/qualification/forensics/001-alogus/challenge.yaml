description: Dillan Duck is an intern who has just been accepted at PT Santoso Star. One day, Mr. Santoso shared a link to an important zip file to all of his employee. There is an image contained inside that zip file and Mr. Santoso asked every employee to recolor that image and send him the recolored image best suited for the company. Unfortunately, Dillan forgot what the password of that zip file is and tried to contact Mr. Santoso. Can you get the contents of that file?
