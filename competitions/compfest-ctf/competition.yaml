notes: COMPFEST as a festival states that it has been held annually since 2009. That year is the festival's
  first event, not a confirmed first year of the CTF branch. CTFtime lists COMPFEST CTF events for 2020
  through 2026. Those CTFtime listings are public mirrors, so their windows are not recorded as the local
  competition dates. The organizer GitHub organization ctfcompfest published problem sets for COMPFEST 12
  through 15, archived as the 2020 through 2023 editions. No organizer problem set was found there for
  2024, 2025, or 2026. A 2019 edition was present in the previous archive record and remains unverified.
