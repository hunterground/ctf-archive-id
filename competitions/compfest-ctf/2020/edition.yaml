notes: >
  COMPFEST 12. The organizer published the qualification and final problem sets in ctfcompfest/compfest12-qualification and ctfcompfest/compfest12-final. The calendar year follows the festival numbering: the COMPFEST 14 READMEs name 2022, the COMPFEST 15 qualification README names 2023, and compfest.id describes the current festival as the 18th edition. COMPFEST 12 is the 2020 edition. The repositories do not state the local event dates. The CTFtime listing is the public mirror, so its window is not recorded as the local dates.
