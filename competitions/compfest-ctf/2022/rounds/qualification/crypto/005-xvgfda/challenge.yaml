description: |-
  I found an old note on my bookshelf. the cipher looks common, yet peculiar.
  ```javascript
  //Holland, August 3rd 1920
  //nachtbommenwerper

  GFDXAXV FVAGXAAF AAGXFXA AXXXDVF FGFFAAA XAGGFFA FFDGFDF
  "the key is logical".
  ```
  hmm... weird.
