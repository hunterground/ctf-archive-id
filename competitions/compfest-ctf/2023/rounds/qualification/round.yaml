notes: Qualification problem set for COMPFEST 15. The README titles it Qualification CTF COMPFEST 2023 and says the set also covers the mirror. Category counts are crypto 4, forensics 4, misc 5, osint 2, pwn 4, rev 4, web 4. Imported from the organizer repository on 2026-11-22. Every problem-set README states that the problems are licensed CC BY-SA 4.0 to the respective author. Sequence numbers are alphabetical by archived challenge name within each category. Author solution directories named writeup, solver, solution, answer, or exploit, and solver scripts at the challenge root, were placed under solvers/ and are not recorded in challenge.yaml. Editor metadata, Python bytecode caches, and a committed virtual environment inside one solver directory were not copied.
