notes: ' The distribution''s own original/src/editor/.gitignore carries a ''code/*'' rule, which would
  cause Git to skip original/src/editor/code/.gitkeep on a fresh clone. That file is the only member of
  its directory and exists to keep the directory in the distribution, so it was added to the index with
  git add -f. The nested .gitignore was not edited, because it is part of the preserved original tree.'
