{% extends "base.html" %}
{% block title %}Register - PrevCloud{% endblock %}
{% block auth_content %}
<style>
    .auth-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0082c9 0%, #004d7a 100%);
        padding: 24px;
    }
    .auth-box {
        background: white;
        border-radius: 12px;
        box-shadow: 0 25px 50px rgba(0,0,0,0.25);
        width: 100%;
        max-width: 420px;
        overflow: hidden;
    }
    .auth-header {
        background: linear-gradient(135deg, #0082c9, #006aa3);
        color: white;
        padding: 32px;
        text-align: center;
    }
    .auth-logo {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 8px;
    }
    .auth-logo-icon {
        width: 48px;
        height: 48px;
        background: rgba(255,255,255,0.2);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .auth-title { font-size: 1.8rem; font-weight: 700; }
    .auth-subtitle { opacity: 0.8; font-size: 0.9rem; margin-top: 4px; }
    .auth-body { padding: 32px; }
    .auth-body .form-control { padding: 11px 14px; }
    .auth-footer {
        text-align: center;
        padding: 16px 32px 24px;
        font-size: 0.9rem;
        color: #6b7280;
    }
    .auth-footer a { color: #0082c9; font-weight: 500; text-decoration: none; }
    .btn-auth { width: 100%; padding: 12px; font-size: 1rem; border-radius: 8px; justify-content: center; }
</style>
<div class="auth-page">
    <div class="auth-box">
        <div class="auth-header">
            <div class="auth-logo">
                <div class="auth-logo-icon">
                    <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
                        <path d="M8 20C8 15.58 11.58 12 16 12s8 3.58 8 8" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                        <path d="M12 20C12 17.79 13.79 16 16 16s4 1.79 4 4" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                        <circle cx="16" cy="22" r="2" fill="white"/>
                    </svg>
                </div>
                <span class="auth-title">PrevCloud</span>
            </div>
            <div class="auth-subtitle">Create your free account</div>
        </div>
        <div class="auth-body">
            <form method="POST">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Choose a username (min 3 chars)" required autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Choose a password (min 6 chars)" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" name="confirm_password" class="form-control" placeholder="Repeat your password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-auth">Create Account</button>
            </form>
        </div>
        <div class="auth-footer">
            Already have an account? <a href="{{ url_for('login') }}">Log in</a>
        </div>
    </div>
</div>
{% endblock %}
