version: '3.8'

services:
  instancer:
    build: .
    container_name: deadend_instancer
    ports:
      - "8200:8000"
    volumes:
      # 1. MOUNT THE DOCKER SOCKET: Allows the instancer to spawn sibling containers on the host
      - /var/run/docker.sock:/var/run/docker.sock
      
      # 2. MOUNT THE CHALLENGE FOLDER: So the instancer can read the challenge's docker-compose.yml
      - ./challenge:/app/challenge
    restart: unless-stopped

# We do not define a custom network here. 
# The instancer runs on the default bridge, and spawns isolated networks for each team.