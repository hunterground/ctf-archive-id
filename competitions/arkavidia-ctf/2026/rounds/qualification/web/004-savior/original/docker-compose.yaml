version: '3'

services:
  proxy:
    image: nginx:1.29.1
    restart: always
    ports:
      - 8867:80
    volumes:
      - ./src:/var/www/html:ro
      - ./proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal
    depends_on:
      - bot
  bot:
    build:
      context: bot
      args:
        - BROWSER=chromium
    restart: always
    environment:
      APPNAME: Admin
      APPURL: http://proxy/
      APPURLREGEX: ^http(|s)://.*$
      APPFLAG: ARKAV{l1k3_4_w3l1_m4d3_f1lm_060ee130e3e0f0577da4c5e6ea2ccc693bf866dc63b2d961d03c765124b0927a}
      APPLIMIT: 2
      APPLIMITTIME: 60
      USE_PROXY: 1
      DISPLAY: ${DISPLAY}
    networks:
      - internal
      
networks:
  internal: