{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Dashboard{% endblock %}</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token }}">

</head>

<body>

    <link rel="stylesheet" href="{% static 'app/css/main.css' %}">
    <script src="{% static 'app/js/main.js' %}"></script>

    <header>
        <nav class="navbar">
            <a href="{% url 'dashboard' %}" class="nav-button">Dashboard</a>
            {% if user.is_authenticated %}
                <a href="{% url 'account' username=user.username %}" class="nav-button">My Account</a>
                <a href="{% url 'logout' %}" class="nav-button">Logout</a>
            {% else %}
                <a href="{% url 'register' %}" class="nav-button">Register</a>
                <a href="{% url 'login' %}" class="nav-button">Login</a>
            {% endif %}
        </nav>
    </header>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

</body>
