notes: ITB reports the Arkavidia 6.0 festival on 8–9 February 2020. The Capture The Flag guidebook dates
  qualification on 5 January 2020, online, and the final on 9 February 2020 at ITB. The guidebook says the
  final format is attack-defense. Challenge files come from mabdullahmunir/CTF-Arkavidia-6, a personal
  repository whose root LICENSE is MIT, copyright 2020 mabdullahmunir. It is not the ctf-itb organizer
  problem set. Thirteen qualification and four final challenges were copied from commit
  97cc9f5d5fff158db83d9f7a411e7022c94b4b71. The repository contains no solver files. Empty init.md files
  were not copied.
