description: "**SPOILER ALERT**\n\nThere was a king who ruled over a dying land. The king was valiant\
  \ and wise.\nRefusing to embrace despair, he thought of an audacious plan, gathered his\ncompanions,\
  \ and braved the endless desert to enter the Tomb of Ariel, where\nthe Great River flowed endlessly\
  \ from the future into the past. Thus, the \nvaliant king became a guide who guarded his people in their\
  \ nightmares.\n\nThey built a city at the edge of dawn and gathered an army to vanquish that \nwhich\
  \ was defiled. However, in the end, the army was destroyed, the city was \nlost, and the valiant king\
  \ himself succumbed to madness.\n\nConsumed by wrath and resentment, he turned into a mindless beast\
  \ and roamed \nthe Great River for countless years. Nothing could withstand his hunger and \nfury...\
  \ until, one day, the mad king met a treacherous shadow.\n\n\"But what do you even know?\" said the\
  \ shadow. \"Do you think you're so special? \nI know fury, too. I know hunger, too. I know madness,\
  \ too! Oh... and I've \nkilled plenty of creatures more powerful than me, too. Who are you to dare \n\
  stare me down, beast?\"\n\n\"I am Lost from Light, who was born from the shadows. I am the rightful\
  \ heir \nof death and the bastard son of fate. Wherever I go, ruin follows. If you had \nany sense,\
  \ you would have run away as soon as you saw me.\"\n\nAnd, true to his word, treacherous Lost from Light\
  \ battled the mad king, \neventually becoming his doom.\n\nThat was how the king who had outlived his\
  \ land died.\n\n\n**NP: read Shadow Slave it's PEAK**"
