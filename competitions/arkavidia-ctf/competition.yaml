notes: Challenge files were copied from the ctf-itb problem sets for Arkavidia 7.0 qualification,
  Arkavidia 9.0 warmup, qualification, and final, and Arkavidia 10.0 warmup, qualification, and final.
  Those repositories have no root license file; on 2026-11-21 the archive was instructed to record them
  as MIT. Arkavidia 6.0 (2020) was copied from mabdullahmunir/CTF-Arkavidia-6, whose root LICENSE is MIT.
  Arkavidia 10.0 is the 2026 edition. Arkavidia 11.0 is stored under 2027 because its published
  final stage ends on 31 January 2027, and it starts in November 2026. No challenge repository for 11.0
  was found. The CTF ITB write-up collection and the Arkavidia 5.0 pwn and reverse write-up repository
  remain registered and were not downloaded. CTFd-Arkavidia is the event platform, not a challenge set.
