    type: writeup
    accessed: '2026-11-23'
  notes: 'Qualification-round material, not imported and awaiting a maintainer decision. README.txt says
    "copyright@FOSA2015" and describes the upload as the 2015 Cyber Jawara run by ID-SIRTII, collected
    by team ISA of Forum Open Source Akakom. The round attribution is established: the 2015 event had
    an online qualification followed by an offline final for 16 finalists from 208 teams, and a participant
    blog published these files with the remark that the online competition had finished and the offline
    finalists announced. The set is therefore the qualification round, and it shares no challenge name
    with the RNDC final write-up that was imported. The files are a flat attachment dump with no per-challenge
    directories and no category labels. Participant blogs identify most individual files as separate challenges:
    haXOR (easy, 25 points, XOR with key 6), 132486.tar.gz (easy, 25 points, a mislabelled text file decoded
    from base64), Camouflage.mp4 (easy, 25 points, steganography with unfiction Camouflage), LoginCJ.exe
    (medium I, Windows reversing), CJ15 (day 2, ELF 32-bit, XOR with 22), and suunto.png with Qer.zip
    as one steganography challenge (EXIF short URL to a QR-puzzle archive). cj2015.zip holds cj2015.exe
    with library.zip and python27.dll and has no located write-up, so its category is unknown. Two blockers
    remain before import: the file-to-event-category mapping is supplied by third-party blogs rather than
    the source, and redistribution is not granted, because "copyright@FOSA2015" is a copyright assertion
    rather than a license. The maintainer''s standing instruction treats a source with no license as MIT,
    but this source carries an explicit copyright claim, so that instruction does not obviously apply
    and the question is left open.'
