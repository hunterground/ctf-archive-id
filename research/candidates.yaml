  - name: "Liga KOMATIK"
    possible_id: liga-komatik-ctf
    status: needs_scope_review
    reason: >
      Liga KOMATIK is Universitas Gadjah Mada's internal selection
      for its GEMASTIK contingent. KOMATIK describes the cybersecurity
      portion as a workshop and simulation of the GEMASTIK Keamanan
      Siber branch, not a public CTF. It was removed from
      competitions/ for that reason. A 2025 selection is documented,
      and KOMATIK says the program began in 2021.
    next_steps:
      - Confirm whether any edition was a public CTF rather than an internal selection.
      - Keep it separate from GEMASTIK Keamanan Siber.
    references:
      - title: "Liga KOMATIK"
        url: "https://komatik.wg.ugm.ac.id/liga-komatik/"
        type: official_website
        accessed: "2026-11-21"
